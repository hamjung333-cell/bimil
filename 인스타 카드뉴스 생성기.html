<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인스타그램 카드뉴스 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Do+Hyeon&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @font-face {
    font-family: 'Gmarket Sans';
    font-weight: 300;
    font-style: normal;
    font-display: swap;
    src: url('https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSansLight.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSansLight.woff') format('woff');
  }
  @font-face {
    font-family: 'Gmarket Sans';
    font-weight: 500;
    font-style: normal;
    font-display: swap;
    src: url('https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSansMedium.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSansMedium.woff') format('woff');
  }
  @font-face {
    font-family: 'Gmarket Sans';
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    src: url('https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSansBold.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSansBold.woff') format('woff');
  }
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e2229;
    --border: #2a2f3a;
    --text: #e8e9ec;
    --muted: #9198a5;
    --accent: #ffd400;
    --accent2: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  .app { display: flex; height: 100vh; }

  .left {
    width: 380px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .left-inner { padding: 20px 20px 40px; }
  h1 { font-size: 17px; font-weight: 700; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }

  .upload-box {
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    background: var(--panel2);
    padding: 18px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    display: block;
  }
  .upload-box:hover, .upload-box.dragover {
    border-color: var(--accent2);
    background: #1a1f2b;
  }
  .upload-box input { display: none; }
  .upload-box .icon { font-size: 20px; margin-bottom: 4px; }
  .upload-box .txt { font-size: 12.5px; color: var(--muted); }
  .upload-box .txt b { color: var(--text); }

  .section { margin-top: 22px; }
  .section-title { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
  .thumb {
    width: 62px; height: 77.5px;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    border: 2px solid transparent;
    background: #000;
    flex-shrink: 0;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.active { border-color: var(--accent2); }
  .thumb .num {
    position: absolute; top: 2px; left: 3px;
    font-size: 9px; background: rgba(0,0,0,0.6); color: #fff;
    padding: 1px 4px; border-radius: 4px;
  }
  .thumb .del {
    position: absolute; top: 2px; right: 2px;
    width: 15px; height: 15px; border-radius: 50%;
    background: rgba(0,0,0,0.65); color: #fff;
    font-size: 10px; line-height: 15px; text-align: center;
    display: none;
  }
  .thumb:hover .del { display: block; }
  .thumb-add {
    width: 62px; height: 77.5px;
    border-radius: 6px;
    border: 1.5px dashed var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--muted); font-size: 20px;
    flex-shrink: 0;
  }
  .thumb-add:hover { border-color: var(--accent2); color: var(--text); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input[type=text], .field textarea {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 10px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
  }
  .field textarea { min-height: 66px; line-height: 1.4; }
  .field input[type=text]:focus, .field textarea:focus { outline: none; border-color: var(--accent2); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
  .hint b { color: var(--accent); }

  .nav-row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  .nav-row .pos { flex: 1; text-align: center; font-size: 13px; color: var(--muted); }
  .nav-btn {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    cursor: pointer; font-size: 14px;
  }
  .nav-btn:disabled { opacity: .35; cursor: not-allowed; }

  .font-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .font-tab {
    flex: 1 1 calc(33.33% - 4px);
    min-width: 100px;
    background: var(--panel2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
    cursor: pointer;
    color: var(--text);
    font-size: 13px;
  }
  .font-tab.active { border-color: var(--accent2); background: #202940; }
  .font-tab .fname { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .font-tab.active .fname { color: var(--accent2); }

  .pos-btns { display: flex; gap: 6px; }
  .pos-btn {
    flex: 1;
    background: var(--panel2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 4px;
    text-align: center;
    cursor: pointer;
    color: var(--text);
    font-size: 12.5px;
  }
  .pos-btn.active { border-color: var(--accent2); background: #202940; color: var(--accent2); }

  .slider-row { margin-bottom: 14px; }
  .slider-row label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .slider-row label .val { color: var(--text); font-weight: 600; }
  .slider-row input[type=range] {
    width: 100%; accent-color: var(--accent2);
  }

  .wm-toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .switch { position: relative; width: 38px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-el {
    position: absolute; cursor: pointer; inset: 0;
    background: var(--border); border-radius: 22px; transition: .15s;
  }
  .slider-el:before {
    content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px;
    background: #fff; border-radius: 50%; transition: .15s;
  }
  .switch input:checked + .slider-el { background: var(--accent2); }
  .switch input:checked + .slider-el:before { transform: translateX(16px); }
  .wm-corner { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; margin-bottom: 14px; }
  .corner-btn {
    background: var(--panel2); border: 1.5px solid var(--border); border-radius: 8px;
    padding: 8px 4px; text-align: center; cursor: pointer; color: var(--text); font-size: 12px;
  }
  .corner-btn.active { border-color: var(--accent2); background: #202940; color: var(--accent2); }
  .wm-body { display: none; }
  .wm-body.show { display: block; }

  button.btn {
    background: var(--accent2);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    width: 100%;
  }
  button.btn:hover { filter: brightness(1.08); }
  button.btn.secondary { background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
  button.btn.danger { background: #3a1f24; border: 1px solid #5a2a30; color: #ff8a8a; }
  button.btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button { flex: 1; }

  .empty-state {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--muted); font-size: 14px; text-align: center; padding: 40px;
  }

  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    overflow: auto;
    background:
      linear-gradient(45deg, #14161b 25%, transparent 25%),
      linear-gradient(-45deg, #14161b 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #14161b 75%),
      linear-gradient(-45deg, transparent 75%, #14161b 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
    background-color: #0b0c0f;
  }
  .preview-col { display: flex; flex-direction: column; align-items: center; max-height: 100%; }
  .preview-wrap {
    max-height: calc(100vh - 170px);
    max-width: 100%;
    aspect-ratio: 4/5;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    cursor: grab;
    position: relative;
  }
  .preview-wrap.dragging { cursor: grabbing; }
  .preview-wrap canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .crop-bar {
    width: 100%;
    max-width: 420px;
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
  }
  .crop-bar .crop-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; display:flex; justify-content: space-between; align-items:center; }
  .crop-bar .crop-title button { background: none; border: none; color: var(--accent2); font-size: 12px; cursor: pointer; padding: 0; }
  .crop-bar input[type=range] { width: 100%; accent-color: var(--accent2); }
  .crop-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <div class="left-inner">
      <h1>인스타그램 카드뉴스 생성기</h1>
      <p class="sub">사진마다 개별 4:5 인스타 게시물로 변환</p>

      <label class="upload-box" id="uploadBox">
        <input type="file" id="fileInput" accept="image/*" multiple>
        <div class="icon">📷</div>
        <div class="txt"><b>클릭하여 사진 선택</b> 또는 드래그 &amp; 드롭<br>(Ctrl+V로 붙여넣기도 가능)</div>
      </label>

      <div id="workArea" style="display:none;">
        <div class="section">
          <div class="section-title">사진 목록 (<span id="thumbCount">0</span>)</div>
          <div class="thumbs" id="thumbs"></div>
        </div>

        <div class="section">
          <div class="nav-row">
            <button class="nav-btn" id="prevBtn">‹</button>
            <span class="pos" id="posLabel">1 / 1</span>
            <button class="nav-btn" id="nextBtn">›</button>
          </div>

          <div class="wm-toggle-row">
            <div class="section-title" style="margin-bottom:0;">ID 텍스트</div>
            <label class="switch">
              <input type="checkbox" id="idToggle">
              <span class="slider-el"></span>
            </label>
          </div>
          <div class="field" id="idBody">
            <input type="text" id="idInput" value="인★아이디">
            <div style="margin-top: 12px; font-size: 12px; color: var(--muted); margin-bottom: 8px;">크기</div>
            <div class="pos-btns" id="idSizeBtns">
              <div class="pos-btn" data-size="50">크게</div>
              <div class="pos-btn active" data-size="38">보통</div>
              <div class="pos-btn" data-size="28">작게</div>
            </div>
          </div>
          <div class="field">
            <label>헤드라인 (줄바꿈으로 여러 줄, [[ ]]=노란 강조)</label>
            <textarea id="hlInput">이번 주 신상만
[[최대 70% 할인]]</textarea>
            <div class="hint">예: <b>[[70% 할인]]</b> → 대괄호는 사라지고 해당 글자만 노란색. 줄바꿈 제한 없음</div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">폰트</div>
          <div class="font-tabs" id="fontTabs"></div>
        </div>

        <div class="section">
          <div class="section-title">헤드라인 글씨 크기</div>
          <div class="pos-btns" id="sizeBtns">
            <div class="pos-btn" data-size="100">매우 크게</div>
            <div class="pos-btn active" data-size="85">크게 (기본)</div>
            <div class="pos-btn" data-size="65">보통</div>
            <div class="pos-btn" data-size="45">작게</div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">글씨 위치 (하단 기준)</div>
          <div class="pos-btns" id="posBtns">
            <div class="pos-btn" data-pos="bottom1">하단 · 위</div>
            <div class="pos-btn" data-pos="bottom2">하단 · 기본</div>
            <div class="pos-btn" data-pos="bottom3">하단 · 아래</div>
            <div class="pos-btn active" data-pos="bottom4">하단 · 딱 붙게</div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">하단 명암</div>
          <div class="slider-row">
            <label>어두운 정도 <span class="val" id="darknessVal">140%</span></label>
            <input type="range" id="darknessSlider" min="0" max="150" value="140">
          </div>
        </div>

        <div class="section">
          <div class="wm-toggle-row">
            <div class="section-title" style="margin-bottom:0;">워터마크</div>
            <label class="switch">
              <input type="checkbox" id="wmToggle">
              <span class="slider-el"></span>
            </label>
          </div>
          <div class="wm-body show" id="wmBody">
            <div class="field">
              <label>워터마크 텍스트</label>
              <input type="text" id="wmText" value="@my_brand">
            </div>
            <div class="slider-row">
              <label>투명도 <span class="val" id="wmOpacityVal">75%</span></label>
              <input type="range" id="wmOpacitySlider" min="10" max="100" value="75">
            </div>
            <div class="wm-corner" id="wmCorner">
              <div class="corner-btn" data-corner="tl">좌상단</div>
              <div class="corner-btn" data-corner="tr">우상단</div>
              <div class="corner-btn" data-corner="bl">좌하단</div>
              <div class="corner-btn active" data-corner="br">우하단</div>
            </div>
          </div>
        </div>

        <div class="section">
          <button class="btn secondary" id="applyAllBtn">이 설정 전체 적용</button>
        </div>
        <div class="section" style="margin-top:10px;">
          <button class="btn danger" id="removeBtn">이 사진 삭제</button>
        </div>

        <div class="section">
          <div class="field">
            <label>파일명 (예: 과일 → 과일 001.png, 과일 002.png ...)</label>
            <input type="text" id="filenamePrefix" placeholder="card">
          </div>
          <div class="btn-row" style="margin-bottom:8px;">
            <button class="btn" id="downloadOneBtn">현재 사진 PNG 저장</button>
          </div>
          <div class="btn-row">
            <button class="btn secondary" id="downloadAllBtn">전체 PNG 다운로드 (ZIP)</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="right" id="right">
    <div class="empty-state" id="emptyState">왼쪽에서 사진을 업로드하면<br>여기에 미리보기가 표시됩니다.</div>
  </div>
</div>

<script>
const W = 1080, H = 1350;
const YELLOW = '#FFE400';
const WHITE = '#FFFFFF';

const FONT_OPTIONS = [
  { key: 'pretendard', label: 'Pretendard', family: "'Pretendard','Noto Sans KR',sans-serif", weight: 900, idWeight: 500 },
  { key: 'gmarket',    label: '지마켓산스',   family: "'Gmarket Sans',sans-serif",               weight: 700, idWeight: 500 },
  { key: 'dohyeon',    label: '도현체',       family: "'Do Hyeon',sans-serif",                   weight: 400, idWeight: 400 },
];

const POSITIONS = {
  bottom1: { id: 0.48, hlTop: 0.58, hlBottom: 0.73 },
  bottom2: { id: 0.55, hlTop: 0.65, hlBottom: 0.80 },
  bottom3: { id: 0.62, hlTop: 0.72, hlBottom: 0.87 },
  bottom4: { id: 0.74, hlTop: 0.80, hlBottom: 0.955 },
};

let cards = []; // {id, img, src, idText, headline, fontKey, position, darkness, wmEnabled, wmText, wmOpacity, wmCorner, zoom, panX, panY}
let currentIndex = -1;
let uid = 0;

const fileInput = document.getElementById('fileInput');
const uploadBox = document.getElementById('uploadBox');
const workArea = document.getElementById('workArea');
const right = document.getElementById('right');
const emptyState = document.getElementById('emptyState');
const thumbs = document.getElementById('thumbs');
const thumbCount = document.getElementById('thumbCount');
const posLabel = document.getElementById('posLabel');
const idToggle = document.getElementById('idToggle');
const idBody = document.getElementById('idBody');
const idInput = document.getElementById('idInput');
const hlInput = document.getElementById('hlInput');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const fontTabsEl = document.getElementById('fontTabs');
const sizeBtnsEl = document.getElementById('sizeBtns');
const idSizeBtnsEl = document.getElementById('idSizeBtns');
const posBtnsEl = document.getElementById('posBtns');
const darknessSlider = document.getElementById('darknessSlider');
const darknessVal = document.getElementById('darknessVal');
const wmToggle = document.getElementById('wmToggle');
const wmBody = document.getElementById('wmBody');
const wmText = document.getElementById('wmText');
const wmOpacitySlider = document.getElementById('wmOpacitySlider');
const wmOpacityVal = document.getElementById('wmOpacityVal');
const wmCornerEl = document.getElementById('wmCorner');
const filenamePrefixInput = document.getElementById('filenamePrefix');

let previewCanvas = null;

FONT_OPTIONS.forEach(f => {
  const el = document.createElement('div');
  el.className = 'font-tab' + (f.key === 'pretendard' ? ' active' : '');
  el.dataset.font = f.key;
  el.innerHTML = `<div style="font-family:${f.family}; font-size:15px;">가</div><div class="fname">${f.label}</div>`;
  el.addEventListener('click', () => {
    if (currentIndex === -1) return;
    document.querySelectorAll('.font-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    cards[currentIndex].fontKey = f.key;
    drawCard(cards[currentIndex], previewCanvas);
  });
  fontTabsEl.appendChild(el);
});

posBtnsEl.addEventListener('click', e => {
  const btn = e.target.closest('.pos-btn');
  if (!btn || currentIndex === -1) return;
  posBtnsEl.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  cards[currentIndex].position = btn.dataset.pos;
  drawCard(cards[currentIndex], previewCanvas);
});

sizeBtnsEl.addEventListener('click', e => {
  const btn = e.target.closest('.pos-btn');
  if (!btn || currentIndex === -1) return;
  sizeBtnsEl.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  cards[currentIndex].headlineSize = Number(btn.dataset.size);
  drawCard(cards[currentIndex], previewCanvas);
});

idSizeBtnsEl.addEventListener('click', e => {
  const btn = e.target.closest('.pos-btn');
  if (!btn || currentIndex === -1) return;
  idSizeBtnsEl.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  cards[currentIndex].idFontSize = Number(btn.dataset.size);
  drawCard(cards[currentIndex], previewCanvas);
});

darknessSlider.addEventListener('input', () => {
  darknessVal.textContent = darknessSlider.value + '%';
  if (currentIndex === -1) return;
  cards[currentIndex].darkness = Number(darknessSlider.value);
  drawCard(cards[currentIndex], previewCanvas);
});

wmCornerEl.addEventListener('click', e => {
  const btn = e.target.closest('.corner-btn');
  if (!btn || currentIndex === -1) return;
  document.querySelectorAll('.corner-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  cards[currentIndex].wmCorner = btn.dataset.corner;
  drawCard(cards[currentIndex], previewCanvas);
});

idToggle.addEventListener('change', () => {
  idBody.style.display = idToggle.checked ? 'block' : 'none';
  if (currentIndex === -1) return;
  cards[currentIndex].idEnabled = idToggle.checked;
  drawCard(cards[currentIndex], previewCanvas);
});

wmToggle.addEventListener('change', () => {
  wmBody.classList.toggle('show', wmToggle.checked);
  if (currentIndex === -1) return;
  cards[currentIndex].wmEnabled = wmToggle.checked;
  drawCard(cards[currentIndex], previewCanvas);
});

wmText.addEventListener('input', () => {
  if (currentIndex === -1) return;
  cards[currentIndex].wmText = wmText.value;
  drawCard(cards[currentIndex], previewCanvas);
});

wmOpacitySlider.addEventListener('input', () => {
  wmOpacityVal.textContent = wmOpacitySlider.value + '%';
  if (currentIndex === -1) return;
  cards[currentIndex].wmOpacity = Number(wmOpacitySlider.value);
  drawCard(cards[currentIndex], previewCanvas);
});

uploadBox.addEventListener('dragover', e => { e.preventDefault(); uploadBox.classList.add('dragover'); });
uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('dragover'));
uploadBox.addEventListener('drop', e => {
  e.preventDefault();
  uploadBox.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => handleFiles(e.target.files));

// 클립보드에 복사된 이미지 붙여넣기 (Ctrl+V / Cmd+V)
window.addEventListener('paste', e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  const files = [];
  for (const item of items) {
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (file) files.push(file);
    }
  }
  if (files.length) {
    e.preventDefault();
    handleFiles(files);
  }
});

function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  let firstNewIndex = -1;
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const id = 'c' + (uid++);
        const ref = currentIndex !== -1 ? cards[currentIndex] : null;
        cards.push({
          id, img, src: ev.target.result,
          idText: idInput.value || '인★아이디',
          headline: hlInput.value || '',
          fontKey: ref ? ref.fontKey : 'pretendard',
          position: ref ? ref.position : 'bottom4',
          headlineSize: ref ? ref.headlineSize : 66,
          idFontSize: ref ? ref.idFontSize : 38,
          darkness: ref ? ref.darkness : 140,
          idEnabled: ref ? ref.idEnabled : false,
          wmEnabled: ref ? ref.wmEnabled : false,
          wmText: ref ? ref.wmText : '@my_brand',
          wmOpacity: ref ? ref.wmOpacity : 75,
          wmCorner: ref ? ref.wmCorner : 'br',
          zoom: 1,
          panX: null,
          panY: null,
        });
        if (firstNewIndex === -1) firstNewIndex = cards.length - 1;
        loaded++;
        if (loaded === files.length) {
          selectCard(currentIndex === -1 ? firstNewIndex : currentIndex);
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  fileInput.value = '';
}

function renderThumbs() {
  thumbCount.textContent = cards.length;
  thumbs.innerHTML = '';
  cards.forEach((card, i) => {
    const t = document.createElement('div');
    t.className = 'thumb' + (i === currentIndex ? ' active' : '');
    t.innerHTML = `<img src="${card.src}"><span class="num">${i + 1}</span><span class="del" title="삭제">✕</span>`;
    t.addEventListener('click', (e) => {
      if (e.target.classList.contains('del')) {
        e.stopPropagation();
        removeCard(i);
      } else {
        selectCard(i);
      }
    });
    thumbs.appendChild(t);
  });
  const addBtn = document.createElement('label');
  addBtn.className = 'thumb-add';
  addBtn.innerHTML = '+';
  addBtn.title = '사진 추가';
  addBtn.addEventListener('click', () => fileInput.click());
  thumbs.appendChild(addBtn);
}

function syncControlsToCard(card) {
  idInput.value = card.idText;
  hlInput.value = card.headline;
  document.querySelectorAll('.font-tab').forEach(t => t.classList.toggle('active', t.dataset.font === card.fontKey));
  posBtnsEl.querySelectorAll('.pos-btn').forEach(b => b.classList.toggle('active', b.dataset.pos === card.position));
  sizeBtnsEl.querySelectorAll('.pos-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.size) === (card.headlineSize || 66)));
  idSizeBtnsEl.querySelectorAll('.pos-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.size) === (card.idFontSize || 38)));
  darknessSlider.value = card.darkness;
  darknessVal.textContent = card.darkness + '%';
  idToggle.checked = !!card.idEnabled;
  idBody.style.display = card.idEnabled ? 'block' : 'none';
  wmToggle.checked = !!card.wmEnabled;
  wmBody.classList.toggle('show', !!card.wmEnabled);
  wmText.value = card.wmText || '@my_brand';
  wmOpacitySlider.value = card.wmOpacity;
  wmOpacityVal.textContent = card.wmOpacity + '%';
  document.querySelectorAll('.corner-btn').forEach(b => b.classList.toggle('active', b.dataset.corner === card.wmCorner));
}

// --- crop / cover helpers ---
function getBaseCover(img) {
  const imgRatio = img.width / img.height;
  const canvasRatio = W / H;
  let sw, sh, sx, sy;
  if (imgRatio > canvasRatio) {
    sh = img.height;
    sw = sh * canvasRatio;
    sx = (img.width - sw) / 2;
    sy = 0;
  } else {
    sw = img.width;
    sh = sw / canvasRatio;
    sx = 0;
    sy = (img.height - sh) / 2;
  }
  return { sw, sh, sx, sy };
}

function getCropRect(card) {
  const base = getBaseCover(card.img);
  const zoom = card.zoom || 1;
  const ww = base.sw / zoom;
  const wh = base.sh / zoom;
  let panX = card.panX;
  let panY = card.panY;
  if (panX == null) panX = base.sx + (base.sw - ww) / 2;
  if (panY == null) panY = base.sy + (base.sh - wh) / 2;
  const maxX = card.img.width - ww;
  const maxY = card.img.height - wh;
  panX = Math.max(0, Math.min(maxX, panX));
  panY = Math.max(0, Math.min(maxY, panY));
  return { sx: panX, sy: panY, sw: ww, sh: wh };
}

function selectCard(index) {
  if (index < 0 || index >= cards.length) {
    currentIndex = -1;
    workArea.style.display = 'none';
    emptyState.style.display = 'flex';
    right.innerHTML = '';
    right.appendChild(emptyState);
    renderThumbs();
    return;
  }
  currentIndex = index;
  const card = cards[index];
  workArea.style.display = 'block';
  syncControlsToCard(card);
  posLabel.textContent = `${index + 1} / ${cards.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === cards.length - 1;

  right.innerHTML = '';
  const col = document.createElement('div');
  col.className = 'preview-col';

  const wrap = document.createElement('div');
  wrap.className = 'preview-wrap';
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  wrap.appendChild(canvas);
  col.appendChild(wrap);

  const cropBar = document.createElement('div');
  cropBar.className = 'crop-bar';
  cropBar.innerHTML = `
    <div class="crop-title"><span>사진 위치 / 확대 (4:5에 맞게 자르기)</span><button id="resetCropBtn">초기화</button></div>
    <input type="range" id="zoomSlider" min="100" max="300" value="${Math.round((card.zoom || 1) * 100)}">
    <div class="crop-hint">사진을 드래그해서 위치를 옮기고, 슬라이더로 확대해 원하는 부분만 자를 수 있어요.</div>
  `;
  col.appendChild(cropBar);
  right.appendChild(col);
  previewCanvas = canvas;

  const zoomSlider = cropBar.querySelector('#zoomSlider');
  zoomSlider.addEventListener('input', () => {
    const c = cards[currentIndex];
    const oldRect = getCropRect(c);
    const oldCenterX = oldRect.sx + oldRect.sw / 2;
    const oldCenterY = oldRect.sy + oldRect.sh / 2;
    c.zoom = Number(zoomSlider.value) / 100;
    const base = getBaseCover(c.img);
    const newWw = base.sw / c.zoom;
    const newWh = base.sh / c.zoom;
    c.panX = oldCenterX - newWw / 2;
    c.panY = oldCenterY - newWh / 2;
    drawCard(c, previewCanvas);
  });

  cropBar.querySelector('#resetCropBtn').addEventListener('click', () => {
    const c = cards[currentIndex];
    c.zoom = 1;
    c.panX = null;
    c.panY = null;
    zoomSlider.value = 100;
    drawCard(c, previewCanvas);
  });

  // drag to pan
  let dragging = false;
  let dragStartClientX = 0, dragStartClientY = 0;
  let dragStartRect = null;

  function startDrag(clientX, clientY) {
    dragging = true;
    wrap.classList.add('dragging');
    dragStartClientX = clientX;
    dragStartClientY = clientY;
    dragStartRect = getCropRect(cards[currentIndex]);
  }
  function moveDrag(clientX, clientY) {
    if (!dragging) return;
    const c = cards[currentIndex];
    const boundRect = wrap.getBoundingClientRect();
    const deltaX = clientX - dragStartClientX;
    const deltaY = clientY - dragStartClientY;
    const scaleX = dragStartRect.sw / boundRect.width;
    const scaleY = dragStartRect.sh / boundRect.height;
    c.panX = dragStartRect.sx - deltaX * scaleX;
    c.panY = dragStartRect.sy - deltaY * scaleY;
    drawCard(c, previewCanvas);
  }
  function endDrag() {
    dragging = false;
    wrap.classList.remove('dragging');
  }

  wrap.addEventListener('mousedown', e => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
  window.addEventListener('mouseup', endDrag);
  wrap.addEventListener('touchstart', e => { const t = e.touches[0]; startDrag(t.clientX, t.clientY); }, { passive: true });
  wrap.addEventListener('touchmove', e => { const t = e.touches[0]; moveDrag(t.clientX, t.clientY); }, { passive: true });
  wrap.addEventListener('touchend', endDrag);

  renderThumbs();
  drawCard(card, canvas);
}

function removeCard(index) {
  cards.splice(index, 1);
  if (cards.length === 0) {
    selectCard(-1);
    return;
  }
  const newIndex = Math.min(index, cards.length - 1);
  selectCard(newIndex);
}

idInput.addEventListener('input', () => {
  if (currentIndex === -1) return;
  cards[currentIndex].idText = idInput.value;
  drawCard(cards[currentIndex], previewCanvas);
});
hlInput.addEventListener('input', () => {
  if (currentIndex === -1) return;
  cards[currentIndex].headline = hlInput.value;
  drawCard(cards[currentIndex], previewCanvas);
});

prevBtn.addEventListener('click', () => { if (currentIndex > 0) selectCard(currentIndex - 1); });
nextBtn.addEventListener('click', () => { if (currentIndex < cards.length - 1) selectCard(currentIndex + 1); });

document.getElementById('removeBtn').addEventListener('click', () => {
  if (currentIndex !== -1) removeCard(currentIndex);
});

document.getElementById('applyAllBtn').addEventListener('click', () => {
  if (currentIndex === -1) return;
  const src = cards[currentIndex];
  cards.forEach(card => {
    card.idText = src.idText;
    card.headline = src.headline;
    card.fontKey = src.fontKey;
    card.position = src.position;
    card.headlineSize = src.headlineSize;
    card.idFontSize = src.idFontSize;
    card.darkness = src.darkness;
    card.idEnabled = src.idEnabled;
    card.wmEnabled = src.wmEnabled;
    card.wmText = src.wmText;
    card.wmOpacity = src.wmOpacity;
    card.wmCorner = src.wmCorner;
  });
  drawCard(cards[currentIndex], previewCanvas);
});

function buildFilename(index) {
  const prefix = (filenamePrefixInput.value || '').trim() || 'card';
  const num = String(index + 1).padStart(3, '0');
  return `${prefix} ${num}.png`;
}

document.getElementById('downloadOneBtn').addEventListener('click', () => {
  if (currentIndex === -1) return;
  downloadCanvas(previewCanvas, buildFilename(currentIndex));
});

document.getElementById('downloadAllBtn').addEventListener('click', async () => {
  const btn = document.getElementById('downloadAllBtn');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = '압축 중...';
  try {
    const zip = new JSZip();
    const offCanvas = document.createElement('canvas');
    offCanvas.width = W; offCanvas.height = H;
    for (let i = 0; i < cards.length; i++) {
      drawCard(cards[i], offCanvas);
      const dataUrl = offCanvas.toDataURL('image/png');
      const base64 = dataUrl.split(',')[1];
      zip.file(buildFilename(i), base64, { base64: true });
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(blob);
    const zipPrefix = (filenamePrefixInput.value || '').trim() || 'instagram_cards';
    triggerDownload(url, `${zipPrefix}.zip`);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

function triggerDownload(href, filename) {
  try {
    const link = document.createElement('a');
    link.href = href;
    link.download = filename;
    link.rel = 'noopener';
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  } catch (err) {
    console.error('download failed', err);
    // 다운로드가 차단된 환경(팝업/보안 정책 등)의 폴백: 새 탭에서 열어 우클릭 저장하도록 안내
    const win = window.open(href, '_blank');
    if (!win) {
      alert('다운로드가 차단되었어요. 브라우저의 다운로드/팝업 차단 설정을 확인해주세요.');
    }
  }
}

function downloadCanvas(canvas, filename) {
  let dataUrl;
  try {
    dataUrl = canvas.toDataURL('image/png');
  } catch (err) {
    console.error('toDataURL failed', err);
    alert('이미지를 만드는 중 오류가 발생했어요. 사진을 다시 불러온 후 시도해주세요.');
    return;
  }
  triggerDownload(dataUrl, filename);
}

function getFontOpt(key) {
  return FONT_OPTIONS.find(f => f.key === key) || FONT_OPTIONS[0];
}

function drawZoneOverlay(ctx, zoneTopPx, darknessPct) {
  const padding = 45; // 참고 이미지처럼 짧게 블렌딩되고 바로 진해지도록
  const pct = Math.max(0, Math.min(150, darknessPct));
  // 0~100%: 예전 기준(=지금의 '중간' 어둡기)까지 → 0~0.9
  // 100~150%: 필요하면 그 이상으로 더 어둡게 → 0.9~1.0
  const alpha = pct <= 100 ? (pct / 100) * 0.9 : 0.9 + ((pct - 100) / 50) * 0.1;
  const gradTop = Math.max(0, zoneTopPx - padding);
  const grad = ctx.createLinearGradient(0, gradTop, 0, H);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(0.4, `rgba(0,0,0,${alpha})`); // 위쪽만 짧게 페이드, 그 아래는 거의 단색
  grad.addColorStop(1, `rgba(0,0,0,${alpha})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, gradTop, W, H - gradTop);
}

function drawWatermark(ctx, card) {
  if (!card.wmEnabled || !card.wmText) return;
  const size = 32;
  const opacity = (card.wmOpacity != null ? card.wmOpacity : 75) / 100;
  ctx.font = `500 ${size}px 'Pretendard','Noto Sans KR',sans-serif`;
  ctx.fillStyle = `rgba(255,255,255,${opacity})`;
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 6;
  const pad = 28;
  const corner = card.wmCorner || 'br';
  let x, y, align;
  if (corner === 'tl') { x = pad; y = pad + size * 0.8; align = 'left'; }
  else if (corner === 'tr') { x = W - pad; y = pad + size * 0.8; align = 'right'; }
  else if (corner === 'bl') { x = pad; y = H - pad; align = 'left'; }
  else { x = W - pad; y = H - pad; align = 'right'; }
  ctx.textAlign = align;
  ctx.fillText(card.wmText, x, y);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
}

function drawCard(card, canvas) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const img = card.img;
  const rect = getCropRect(card);
  ctx.drawImage(img, rect.sx, rect.sy, rect.sw, rect.sh, 0, 0, W, H);

  const pos = POSITIONS[card.position] || POSITIONS.bottom2;
  const headlineTop = H * pos.hlTop;
  const headlineBottom = H * pos.hlBottom;

  const fontOpt = getFontOpt(card.fontKey);
  const marginX = W * 0.05;
  const maxWidth = W - marginX * 2;

  const rawLines = (card.headline || '').split('\n');
  const lineCount = Math.max(rawLines.length, 1);
  const headlineFontSize = card.headlineSize || 85; // 줄 수와 상관없이 이 크기로 고정 (버튼으로 선택)

  function segmentsOf(line) {
    const segs = [];
    const re = /\[\[(.*?)\]\]/g;
    let lastIndex = 0, m;
    while ((m = re.exec(line)) !== null) {
      if (m.index > lastIndex) segs.push({ text: line.slice(lastIndex, m.index), color: WHITE });
      segs.push({ text: m[1], color: YELLOW });
      lastIndex = re.lastIndex;
    }
    if (lastIndex < line.length) segs.push({ text: line.slice(lastIndex), color: WHITE });
    if (!segs.length) segs.push({ text: '', color: WHITE });
    return segs;
  }

  function lineWidth(line, size) {
    ctx.font = `${fontOpt.weight} ${size}px ${fontOpt.family}`;
    return segmentsOf(line).reduce((w, seg) => w + ctx.measureText(seg.text).width, 0);
  }

  // 폰트는 가로 폭이 넘칠 때만 줄인다 (줄 수가 늘었다고 줄이지 않음 = 크기 원형 유지)
  let fontSize = headlineFontSize;
  const minFontSize = 15; // 한 줄 자체가 너무 길어서 폭에 안 맞을 때의 안전장치일 뿐, 줄 수와는 무관
  while (fontSize > minFontSize) {
    const widestLine = Math.max(...rawLines.map(l => lineWidth(l, fontSize)), 0);
    if (widestLine <= maxWidth) break;
    fontSize -= 2;
  }

  const lineHeight = fontSize * 1.28;
  const totalTextHeight = lineHeight * lineCount;

  // 세로 공간: 줄이 많아지면 폰트를 줄이는 대신 텍스트 영역을 위쪽으로 넓힌다.
  // 아이디 줄이 들어갈 자리(idGap)까지 감안해서 캔버스 위쪽 여백을 확보한다.
  const idGap = 60; // 헤드라인 맨 윗줄과 아이디 사이 간격
  const canvasTopMargin = 40 + idGap;
  let effectiveTop = Math.min(headlineTop, headlineBottom - totalTextHeight);
  effectiveTop = Math.max(effectiveTop, canvasTopMargin);
  const bandHeight = headlineBottom - effectiveTop;
  let startBaseline = effectiveTop + (fontSize * 0.85) + Math.max(0, (bandHeight - totalTextHeight) / 2);

  // 아이디 위치는 항상 헤드라인 맨 위에서 일정 간격 위에 따라다니도록 계산 (고정 좌표 아님)
  const idY = effectiveTop - idGap;

  // 어두운 그라데이션도 확장된 헤드라인 영역까지 같이 늘려서 가독성을 유지한다.
  const overlayTop = idY - 30;
  drawZoneOverlay(ctx, overlayTop, card.darkness != null ? card.darkness : 140);

  // ID 텍스트 그리기 (활성화된 경우만)
  if (card.idEnabled) {
    const idFontSize = card.idFontSize || 38;
    ctx.font = `${fontOpt.idWeight} ${idFontSize}px ${fontOpt.family}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    ctx.fillStyle = WHITE;
    ctx.fillText('@ ' + (card.idText || ''), marginX, idY);
  }

  ctx.font = `${fontOpt.weight} ${fontSize}px ${fontOpt.family}`;
  ctx.textAlign = 'left';

  rawLines.forEach((line, i) => {
    const y = startBaseline + i * lineHeight;
    let x = marginX;
    segmentsOf(line).forEach(seg => {
      ctx.fillStyle = seg.color;
      ctx.fillText(seg.text, x, y);
      x += ctx.measureText(seg.text).width;
    });
  });

  drawWatermark(ctx, card);
}
