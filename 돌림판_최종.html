<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 돌림판</title>
<style>
  /* ===== 디자인 토큰 ===== */
  :root {
    --bg: #2b2838; --card: #3E3A4E; --panel: #2f2b3d;
    --gold: #ffd54a; --gold-dark: #e0a800; --text: #fff; --ghost: rgba(255,255,255,.14);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display: flex; justify-content: center; align-items: center; padding: 12px;
  }
  .card {
    width: 100%; max-width: 480px; background: var(--card); border-radius: 28px;
    padding: 22px 18px 24px; box-shadow: 0 20px 50px rgba(0,0,0,.45); text-align: center;
  }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 800; color: var(--gold); }
  .desc { margin: 0 0 16px; font-size: 14px; color: #cfcae0; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* ===== 버튼 ===== */
  .btns { display: flex; gap: 12px; }
  .btn {
    flex: 1; height: 54px; border: 0; border-radius: 18px; font-size: 18px; font-weight: 800;
    cursor: pointer; font-family: inherit; transition: transform .1s, opacity .2s;
  }
  .btn:active:not(:disabled) { transform: scale(.96); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: var(--ghost); color: #fff; }
  .btn.main {
    background: linear-gradient(180deg,#ffe680,var(--gold) 55%,var(--gold-dark));
    color: #3a2d00; box-shadow: 0 5px 0 #b88700, 0 8px 14px rgba(0,0,0,.35);
  }
  .btn.main:active:not(:disabled) { box-shadow: 0 2px 0 #b88700; transform: translateY(3px); }

  /* ===== 입력 화면 ===== */
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    border: 0; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700;
    background: var(--ghost); color: #fff; cursor: pointer; font-family: inherit;
  }
  .chip:active { transform: scale(.95); }
  .chip.active { background: var(--gold); color: #3a2d00; }
  .list { max-height: 44vh; overflow-y: auto; padding: 2px; margin-bottom: 10px; text-align: left; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; animation: slideIn .2s ease-out; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .row .no {
    flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--gold); color: #3a2d00;
    font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .row input {
    flex: 1; min-width: 0; height: 46px; border-radius: 14px; border: 2px solid transparent; padding: 0 14px;
    background: var(--panel); color: #fff; font-size: 16px; font-family: inherit;
  }
  .row input:focus { outline: none; border-color: var(--gold); }
  .row .del {
    flex: none; width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--ghost);
    color: #ff9fb2; font-size: 20px; cursor: pointer;
  }
  .row .del:disabled { opacity: .3; cursor: default; }
  .add {
    width: 100%; height: 46px; border-radius: 14px; border: 2px dashed rgba(255,255,255,.35);
    background: transparent; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    font-family: inherit; margin-bottom: 8px;
  }
  .count { font-size: 13px; color: #cfcae0; margin-bottom: 4px; }
  .err { min-height: 20px; color: #ff9fb2; font-size: 13px; margin-bottom: 10px; }

  /* ===== 룰렛 화면 ===== */
  .stage { position: relative; width: 100%; max-width: 400px; margin: 10px auto 24px; aspect-ratio: 1; }
  .wheel-wrap { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  /* 회전 중 황금빛 글로우가 맥동 */
  .stage.spinning .wheel-wrap { animation: glow .5s ease-in-out infinite alternate; }
  @keyframes glow {
    from { box-shadow: 0 0 18px 4px rgba(255,213,74,.45), 0 0 50px 10px rgba(255,126,182,.25); }
    to   { box-shadow: 0 0 34px 10px rgba(255,213,74,.85), 0 0 80px 22px rgba(155,109,255,.45); }
  }
  #wheel { width: 100%; height: 100%; display: block; border-radius: 50%; will-change: transform; }
  #lights { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .pointer {
    position: absolute; top: -10px; left: 50%; margin-left: -17px; z-index: 3;
    width: 0; height: 0; border-left: 17px solid transparent; border-right: 17px solid transparent;
    border-top: 32px solid #ff4d6d; filter: drop-shadow(0 3px 3px rgba(0,0,0,.5));
    transform-origin: 50% 0;
  }
  .go {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 2;
    width: 21%; aspect-ratio: 1; border-radius: 50%; border: 4px solid #fff3b0;
    background: radial-gradient(circle at 35% 30%,#fff1a0,var(--gold) 50%,var(--gold-dark));
    color: #4a3a00; font-weight: 900; font-size: clamp(14px,4.5vw,20px); cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.45), inset 0 -3px 6px rgba(0,0,0,.18);
  }
  .go:active:not(:disabled) { transform: translate(-50%,-50%) scale(.93); }
  .go:disabled { cursor: default; filter: saturate(.7); }

  /* ===== 결과 오버레이 ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,8,20,.72); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 20;
  }
  .overlay.show { display: flex; }
  .result {
    width: 100%; max-width: 400px; background: #4a4560; border-radius: 28px; padding: 28px 20px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.6); animation: pop .5s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .result .trophy { font-size: 52px; animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-10px) scale(1.1); } }
  .result .label { font-size: 16px; color: #e5e0f5; margin: 4px 0 8px; letter-spacing: 2px; }
  .result .name {
    font-weight: 900; line-height: 1.2; margin: 6px 0 22px; overflow-wrap: anywhere; word-break: keep-all;
    background: linear-gradient(90deg,#fff1a0,#ffd54a,#ff9fb2,#ffd54a,#fff1a0); background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 2s linear infinite, pulse 1s ease-in-out infinite alternate;
  }
  @keyframes shine { to { background-position: 200% center; } }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
</style>
</head>
<body>

<main class="card">

  <!-- ================= 1단계: 항목 입력 ================= -->
  <section class="screen active" id="inputScreen">
    <h1>🎡 오늘의 돌림판</h1>
    <p class="desc">먹고 싶은 음식, 사람 이름, 여행지 등 무엇이든 입력하세요!</p>

    <div class="chips">
      <button class="chip active" data-tab="custom">✏️ 직접 입력</button>
      <button class="chip" data-tab="food">🍜 음식</button>
      <button class="chip" data-tab="person">🙋 사람</button>
      <button class="chip" data-tab="trip">✈️ 여행지</button>
    </div>

    <div class="list" id="list"></div>
    <button class="add" id="addBtn">＋ 항목 추가</button>
    <div class="count" id="count"></div>
    <div class="err" id="err"></div>

    <div class="btns">
      <button class="btn main" id="doneBtn">입력 완료</button>
    </div>
  </section>

  <!-- ================= 2단계: 돌림판 ================= -->
  <section class="screen" id="wheelScreen">
    <h1>🎡 오늘의 돌림판</h1>
    <div class="stage" id="stage">
      <div class="pointer" id="pointer"></div>
      <div class="wheel-wrap"><canvas id="wheel"></canvas></div>
      <canvas id="lights"></canvas>
      <button class="go" id="goBtn" aria-label="돌리기">GO</button>
    </div>
    <div class="btns">
      <button class="btn ghost" id="backBtn">다시 입력</button>
      <button class="btn main" id="spinBtn">돌리기</button>
    </div>
  </section>
</main>

<!-- 결과 오버레이 -->
<div class="overlay" id="resultModal">
  <div class="result">
    <div class="trophy">🏆</div>
    <div class="label">최종 선정!</div>
    <div class="name" id="resultName"></div>
    <div class="btns">
      <button class="btn ghost" id="closeBtn">닫기</button>
      <button class="btn main" id="againBtn">한 번 더</button>
    </div>
  </div>
</div>

<canvas id="fx"></canvas>

<script>
/* =========================================================
 * 오늘의 돌림판 (Vanilla JS, 외부 라이브러리 없음)
 * 1) 항목 입력(자유롭게 추가/삭제) → 2) 돌림판 → 3) 10초 회전 → 4) 결과 + 폭죽
 * ======================================================= */

const $ = id => document.getElementById(id);
const MIN_ITEMS = 2, MAX_ITEMS = 30;       // 항목 개수 범위
const SPIN_MS = 10000;                      // 회전 시간 10초
const PALETTE = ["#9b6dff","#a8e063","#ff7eb6","#ff5a4f","#ffd93b","#5eead4",
                 "#4f8cff","#c9b3ff","#ff9f43","#2dd4bf","#f472b6","#84cc16"];
const PRESETS = {
  food:   ["치킨","피자","김밥","떡볶이","삼겹살","초밥"],
  person: ["민준","서연","지우","하준","수아"],
  trip:   ["제주도","부산","강릉","도쿄","방콕","파리"]
};

/* ★ 고정 당첨 이름 목록 ★
 * 입력한 항목 중 이 이름이 하나라도 있으면, 돌림판은 평소처럼 돌지만
 * 결과는 항상 그 항목으로 멈춥니다. (예시 버튼의 첫 번째 이름 3개로 설정)
 * 여러 개가 동시에 입력되면 '입력 순서상 먼저 나온 항목'이 당첨됩니다.
 * 원하는 이름으로 바꾸려면 아래 배열만 수정하세요. 비우면([]) 완전 랜덤입니다. */
const FIXED_NAMES = ["치킨", "민준", "제주도"];
const normalize = s => s.replace(/\s+/g, "").toLowerCase();

let items = [];            // 확정된 항목
let rotation = 0;          // 누적 회전각(deg)
let spinning = false;

/* =========================================================
 * 1단계: 입력 화면
 * ======================================================= */
const listEl = $("list");

// 입력 행 하나를 만든다
function addRow(value = "", focus = false) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = '<span class="no"></span><input type="text" maxlength="20" placeholder="항목 입력"><button class="del" aria-label="삭제">×</button>';
  const input = row.querySelector("input");
  input.value = value;
  // Enter → 다음 행(없으면 새 행 추가)
  input.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const next = row.nextElementSibling;
    if (next) next.querySelector("input").focus();
    else if (rowCount() < MAX_ITEMS) addRow("", true);
  });
  row.querySelector(".del").onclick = () => { row.remove(); refreshRows(); };
  listEl.appendChild(row);
  refreshRows();
  if (focus) { input.focus(); listEl.scrollTop = listEl.scrollHeight; }
}
const rowCount = () => listEl.children.length;

// 번호/삭제 버튼 활성화/카운트 갱신
function refreshRows() {
  [...listEl.children].forEach((r, i) => r.querySelector(".no").textContent = i + 1);
  const canDelete = rowCount() > MIN_ITEMS;
  [...listEl.querySelectorAll(".del")].forEach(b => b.disabled = !canDelete);
  $("addBtn").disabled = rowCount() >= MAX_ITEMS;
  $("count").textContent = `현재 ${rowCount()}칸 (최소 ${MIN_ITEMS}개 ~ 최대 ${MAX_ITEMS}개)`;
}

// 프리셋 채우기
function loadRows(arr) {
  listEl.innerHTML = "";
  arr.forEach(v => addRow(v));
  while (rowCount() < MIN_ITEMS) addRow("");
}

$("addBtn").onclick = () => addRow("", true);
/* ---------- 탭별 목록 보관 ----------
 * 직접 입력 / 음식 / 사람 / 여행지 각각의 목록을 따로 저장해 둡니다.
 * 다른 탭에 갔다 와도 이전에 입력·수정한 내용이 그대로 남습니다. */
const tabs = {
  custom: ["", "", "", ""],
  food:   [...PRESETS.food],
  person: [...PRESETS.person],
  trip:   [...PRESETS.trip]
};
let currentTab = "custom";
const readRows = () => [...listEl.querySelectorAll("input")].map(i => i.value);   // 빈 칸도 그대로 보관

function switchTab(key) {
  if (key === currentTab) return;
  tabs[currentTab] = readRows();            // 떠나기 전에 현재 탭 내용 저장
  currentTab = key;
  loadRows(tabs[key]);                      // 이동할 탭의 저장된 내용 불러오기
  $("err").textContent = "";
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.tab === key));
}
document.querySelectorAll(".chip").forEach(c => c.onclick = () => switchTab(c.dataset.tab));

// '입력 완료' → 값 검증 후 돌림판 화면으로
$("doneBtn").onclick = () => {
  const list = [...listEl.querySelectorAll("input")].map(i => i.value.trim()).filter(Boolean);
  if (list.length < MIN_ITEMS) { $("err").textContent = `항목을 ${MIN_ITEMS}개 이상 입력해 주세요.`; return; }
  $("err").textContent = "";
  items = list;
  rotation = 0;
  wheel.style.transition = "none";
  wheel.style.transform = "rotate(0deg)";
  showScreen("wheelScreen");
  drawWheel();
};
$("backBtn").onclick = () => { if (!spinning) showScreen("inputScreen"); };

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
}

/* =========================================================
 * 2단계: 돌림판 그리기
 * ======================================================= */
const wheel = $("wheel"), ctx = wheel.getContext("2d");
const lights = $("lights"), lctx = lights.getContext("2d");

function colorFor(i) {                       // 첫 칸과 마지막 칸 색이 겹치지 않게
  let c = PALETTE[i % PALETTE.length];
  if (i === items.length - 1 && i > 0 && c === PALETTE[0]) c = PALETTE[6];
  return c;
}
function textColorFor(hex) {                 // 배경 밝기에 따라 글자색 선택
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? "#2b2540" : "#ffffff";
}
const FONT = '"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif';

function drawWheel() {
  const size = wheel.clientWidth; if (!size) return;
  const dpr = window.devicePixelRatio || 1;
  wheel.width = wheel.height = Math.round(size * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);

  const c = size / 2, R = c - 4;
  const rimInner = R - size * 0.05;          // 황금 테두리 두께
  const rW = rimInner - 2;                   // 섹션 반지름
  const n = items.length, arc = Math.PI * 2 / n;

  // 황금 이중 테두리
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, "#fff1a0"); g.addColorStop(.5, "#e0a800"); g.addColorStop(1, "#ffe680");
  ctx.beginPath(); ctx.arc(c, c, R, 0, Math.PI*2); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); ctx.arc(c, c, rimInner + 1, 0, Math.PI*2); ctx.strokeStyle = "#7a5a00"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(c, c, R - 2.5, 0, Math.PI*2); ctx.strokeStyle = "#fff6c4"; ctx.lineWidth = 1; ctx.stroke();

  // 섹션 (0번 칸은 12시 방향에서 시작, 시계 방향)
  for (let i = 0; i < n; i++) {
    const a0 = -Math.PI/2 + i*arc, color = colorFor(i);
    ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, rW, a0, a0 + arc); ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1.5; ctx.stroke();

    // 텍스트: 중심 방향으로 회전, 바깥쪽 정렬
    ctx.save();
    ctx.translate(c, c); ctx.rotate(a0 + arc/2);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    let fs = Math.min(size * 0.075, rW * 0.72 * 2 * Math.sin(arc/2) * 0.8);
    fs = Math.max(fs, 9);
    ctx.font = `800 ${fs}px ${FONT}`;
    const maxW = rW * 0.6;
    while (ctx.measureText(items[i]).width > maxW && fs > 8) { fs -= 1; ctx.font = `800 ${fs}px ${FONT}`; }
    const tc = textColorFor(color);
    ctx.fillStyle = tc;
    if (tc === "#ffffff") { ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 3; }
    ctx.fillText(items[i], rW - size*0.045, 0);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(c, c, size*0.125, 0, Math.PI*2); ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fill();

  // 전구 캔버스 크기 맞춤
  lights.width = lights.height = Math.round(size * dpr);
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ---------- 테두리 전구 애니메이션 (회전 중엔 빠르게 깜빡임) ---------- */
function lightsLoop(t) {
  const size = lights.clientWidth;
  if (size && $("wheelScreen").classList.contains("active")) {
    lctx.clearRect(0, 0, size, size);
    const c = size / 2, r = c - 4 - size * 0.025, N = 28;
    const phase = Math.floor(t / (spinning ? 55 : 350));
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      const on = spinning ? ((i + phase) % 3 === 0) : ((i + phase) % 4 === 0);
      const hue = spinning ? (i * 13 + phase * 20) % 360 : 45;
      lctx.beginPath();
      lctx.arc(c + Math.cos(a) * r, c + Math.sin(a) * r, size * 0.0105, 0, Math.PI*2);
      lctx.fillStyle = on ? `hsl(${hue},100%,${spinning ? 62 : 80}%)` : "#8a6a10";
      lctx.shadowColor = on ? `hsl(${hue},100%,60%)` : "transparent";
      lctx.shadowBlur = on ? 10 : 0;
      lctx.fill();
    }
  }
  requestAnimationFrame(lightsLoop);
}
requestAnimationFrame(lightsLoop);

/* =========================================================
 * 3단계: 회전
 * ======================================================= */
// 휠이 theta도 회전했을 때 12시 방향(포인터)에 있는 칸의 인덱스
function indexAt(theta) {
  const n = items.length, arc = 360 / n;
  return Math.floor(((((-theta) % 360) + 360) % 360) / arc) % n;
}
function currentAngle() {                    // 진행 중 실제 각도 읽기
  const m = getComputedStyle(wheel).transform;
  if (!m || m === "none") return 0;
  const v = m.match(/matrix\(([^)]+)\)/)[1].split(",").map(Number);
  return Math.atan2(v[1], v[0]) * 180 / Math.PI;
}

function spin() {
  if (spinning) return;
  ac();                                      // 오디오 활성화(사용자 제스처 필요)
  spinning = true; setDisabled(true);
  $("stage").classList.add("spinning");

  const n = items.length, arc = 360 / n;
  // 고정 이름이 입력돼 있으면 그 칸을 당첨으로, 없으면 균등 확률 랜덤
  const fixedSet = FIXED_NAMES.map(normalize);
  const fixedIdx = items.findIndex(name => fixedSet.includes(normalize(name)));
  const target = fixedIdx >= 0 ? fixedIdx : Math.floor(Math.random() * n);
  const offset = (Math.random() - 0.5) * arc * 0.7;    // 경계선 회피용 미세 오프셋
  const wantA = target * arc + arc/2 + offset;
  const targetMod = (360 - (wantA % 360)) % 360;
  const curMod = ((rotation % 360) + 360) % 360;
  const delta = (targetMod - curMod + 360) % 360;
  rotation += (10 + Math.floor(Math.random()*3)) * 360 + delta;   // 10~12바퀴

  // 빠르게 가속 후 10초에 걸쳐 아주 천천히 멈춤
  wheel.style.transition = `transform ${SPIN_MS}ms cubic-bezier(.13,.55,.12,1)`;
  wheel.style.transform = `rotate(${rotation}deg)`;

  // 칸 경계를 지날 때마다 틱 소리 + 포인터 흔들림
  let last = -1, lastT = 0, raf;
  const loop = (now) => {
    const idx = indexAt(currentAngle());
    if (last !== -1 && idx !== last && now - lastT > 28) { tick(); wiggle(); lastT = now; }
    last = idx; raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);

  setTimeout(() => {
    cancelAnimationFrame(raf);
    spinning = false; setDisabled(false);
    $("stage").classList.remove("spinning");
    showResult(items[indexAt(rotation)]);            // 최종 각도로 당첨 판별
  }, SPIN_MS + 80);
}
function wiggle() {
  $("pointer").animate([{transform:"rotate(0)"},{transform:"rotate(-22deg)"},{transform:"rotate(0)"}], {duration: 110});
}
function setDisabled(v) { ["goBtn","spinBtn","backBtn"].forEach(id => $(id).disabled = v); }
$("goBtn").onclick = $("spinBtn").onclick = spin;

/* =========================================================
 * 4단계: 결과 + 폭죽
 * ======================================================= */
function showResult(name) {
  const el = $("resultName");
  el.textContent = name;
  const len = [...name].length;
  el.style.fontSize = (len <= 4 ? 68 : len <= 8 ? 50 : len <= 14 ? 38 : 28) + "px";
  $("resultModal").classList.add("show");
  fanfare(); fireworks();
}
$("closeBtn").onclick = () => $("resultModal").classList.remove("show");
$("againBtn").onclick = () => { $("resultModal").classList.remove("show"); spin(); };

/* ---------- 폭죽: 로켓이 올라가 터지고 불꽃 입자가 흩어짐 ---------- */
const fx = $("fx"), fctx = fx.getContext("2d");
let fwRunning = false;
function fireworks(duration = 7000) {
  fx.width = innerWidth; fx.height = innerHeight;
  const W = fx.width, H = fx.height, k = H / 800;
  const rockets = [], sparks = [];
  const start = performance.now(); let lastLaunch = 0;
  if (fwRunning) return; fwRunning = true;

  function launch() {
    rockets.push({ x: W*(0.12 + Math.random()*0.76), y: H, vx: (Math.random()-.5)*1.2,
                   vy: -(13 + Math.random()*4) * k, hue: Math.random()*360 });
  }
  function explode(r) {
    boom();
    const cnt = 80;
    for (let i = 0; i < cnt; i++) {
      const a = (i / cnt) * Math.PI * 2 + Math.random()*.1, s = (Math.random()*6 + 2) * Math.max(k, .6);
      sparks.push({ x: r.x, y: r.y, px: r.x, py: r.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
                    life: 1, decay: .008 + Math.random()*.012, hue: r.hue + Math.random()*40 });
    }
  }
  (function frame(now) {
    const t = now - start;
    fctx.clearRect(0, 0, W, H);
    fctx.globalCompositeOperation = "lighter"; fctx.lineCap = "round";
    if (t < duration && now - lastLaunch > 320) { launch(); if (Math.random() < .4) launch(); lastLaunch = now; }

    for (let i = rockets.length - 1; i >= 0; i--) {         // 로켓
      const r = rockets[i]; r.x += r.vx; r.y += r.vy; r.vy += .22 * k;
      fctx.fillStyle = `hsl(${r.hue},100%,75%)`; fctx.beginPath(); fctx.arc(r.x, r.y, 3, 0, 7); fctx.fill();
      if (r.vy >= -1) { explode(r); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {          // 불꽃 입자
      const p = sparks[i]; p.px = p.x; p.py = p.y;
      p.vx *= .985; p.vy = p.vy * .985 + .07; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      fctx.strokeStyle = `hsla(${p.hue},100%,65%,${p.life})`; fctx.lineWidth = 2.2;
      fctx.beginPath(); fctx.moveTo(p.px, p.py); fctx.lineTo(p.x, p.y); fctx.stroke();
    }
    if (t < duration || rockets.length || sparks.length) requestAnimationFrame(frame);
    else { fctx.clearRect(0, 0, W, H); fwRunning = false; }
  })(start);
}

/* =========================================================
 * 효과음 (Web Audio API로 코드 생성, 외부 파일 없음)
 * ======================================================= */
let audio;
function ac() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (audio && audio.state === "suspended") audio.resume();
  return audio;
}
function tone(freq, dur, type, vol, when = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function tick() { tone(1300 + Math.random()*250, 0.04, "square", 0.05); }
function fanfare() {
  [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, "triangle", .18, i*.12));
  tone(1047, .7, "triangle", .18, .5); tone(1319, .7, "sine", .12, .5);
}
function boom() {                            // 폭죽 터지는 소리(노이즈 버스트)
  const a = ac(); if (!a) return;
  const len = a.sampleRate * .35, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 3);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  f.type = "lowpass"; f.frequency.value = 900; g.gain.value = .22;
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}

/* ---------- 초기화 ---------- */
addEventListener("resize", () => { if ($("wheelScreen").classList.contains("active")) drawWheel(); });
loadRows(tabs.custom);
</script>
