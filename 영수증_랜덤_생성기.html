<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>영수증 랜덤 생성기</title>
<script>
  // html2canvas를 여러 CDN에서 순차 시도 (하나가 막혀도 다음 CDN으로 폴백)
  function loadScript(src){
    return new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  window.html2canvasReady = loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')
    .catch(()=> loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'))
    .catch(()=> loadScript('https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js'))
    .catch(()=> console.error('html2canvas: 모든 CDN 로드 실패'));
</script>
<style>
  :root{
    --bg:#eef0f2;
    --panel:#ffffff;
    --ink:#1c1c1c;
    --muted:#8a8a8a;
    --line:#e2e2e2;
    --accent:#2f6fed;
    --accent-ink:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:960px;margin:0 auto;}
  header{text-align:center;margin-bottom:24px;}
  header h1{font-size:22px;margin:0 0 6px;letter-spacing:-0.02em;}
  header p{font-size:13px;color:var(--muted);margin:0;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
  }
  .panel label{font-size:13px;color:var(--muted);margin-right:2px;}
  select, button, input{
    font-family:inherit;
  }
  select, input[type=text], input[type=number]{
    font-size:14px;
    border-radius:8px;
    border:1px solid var(--line);
    padding:9px 10px;
    background:#fafafa;
  }
  button{
    font-size:14px;
    border-radius:8px;
    border:1px solid var(--line);
    padding:9px 14px;
    background:#fafafa;
    cursor:pointer;
  }
  button.primary{background:var(--accent);color:var(--accent-ink);border:none;font-weight:600;}
  button.primary:hover{filter:brightness(1.06);}
  button.ghost:hover{background:#f0f0f0;}
  #styleToggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  #styleToggle button{border:none;border-radius:0;background:#fafafa;padding:9px 12px;}
  #styleToggle button.active{background:var(--ink);color:#fff;}

  .layout{display:flex;gap:22px;align-items:flex-start;}
  .form-panel{
    flex:0 0 320px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    max-height:78vh;
    overflow-y:auto;
  }
  .stage-col{flex:1;display:flex;justify-content:center;position:sticky;top:20px;}
  @media (max-width:820px){
    .layout{flex-direction:column;}
    .form-panel{width:100%;flex:none;max-height:none;}
    .stage-col{position:static;width:100%;}
  }

  .section-h{font-size:11.5px;font-weight:700;color:#555;margin:18px 0 10px;text-transform:uppercase;letter-spacing:.04em;}
  .section-h:first-child{margin-top:0;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;}
  .field-inline{display:flex;gap:6px;}
  .field-inline input, .field-inline select{flex:1;min-width:0;padding:8px 9px;font-size:13px;}
  .dice{
    flex:0 0 auto;width:32px;height:32px;border-radius:7px;
    border:1px solid var(--line);background:#fafafa;cursor:pointer;
    font-size:14px;display:flex;align-items:center;justify-content:center;padding:0;
  }
  .dice:hover{background:#eee;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#333;margin-bottom:10px;}

  .item-row{border:1px solid var(--line);border-radius:9px;padding:10px 10px 6px;margin-bottom:8px;position:relative;background:#fcfcfc;}
  .item-row .remove{
    position:absolute;top:6px;right:8px;background:none;border:none;
    color:#c33;cursor:pointer;font-size:11.5px;padding:2px 4px;
  }
  .item-grid-name{display:flex;gap:6px;margin-bottom:6px;}
  .item-grid-name input{flex:1;min-width:0;padding:7px 8px;font-size:13px;}
  .item-grid2{display:flex;gap:6px;}
  .item-grid2 .field{flex:1;margin-bottom:0;}
  .item-grid2 input{width:100%;padding:7px 8px;font-size:13px;}
  .add-item{
    width:100%;padding:9px;border:1px dashed #bbb;border-radius:8px;
    background:transparent;color:#555;font-size:12.5px;cursor:pointer;
  }
  .add-item:hover{background:#f3f3f3;}

  /* ---- receipt render ---- */
  .stage{display:flex;justify-content:center;align-items:flex-start;padding:0;border-radius:16px;background:transparent;}

  .receipt{
    width:340px;
    background:#fff;
    padding:32px 26px;
    font-family:'Pretendard','Malgun Gothic',sans-serif;
    color:#1a1a1a;
    font-size:12.5px;
    line-height:1.55;
  }
  .stage.photo .receipt{box-shadow:0 10px 28px rgba(0,0,0,0.16);}
  .stage.flat .receipt{background:#f4f1ea;}

  .r-store{text-align:center;font-size:19px;font-weight:800;letter-spacing:-0.01em;margin-bottom:6px;}
  .r-title{text-align:center;font-size:13px;letter-spacing:10px;color:#333;margin-bottom:14px;padding-left:10px;}
  .dash{border:none;border-top:1px dashed #bbb;margin:10px 0;}
  .row{display:flex;justify-content:space-between;gap:10px;}
  .row .k{color:#333;white-space:nowrap;}
  .row .v{text-align:right;color:#111;}
  .section-title{display:flex;font-weight:700;margin-bottom:6px;}
  .section-title .col-name{flex:1;}
  .section-title .col-qty{width:26px;text-align:center;}
  .section-title .col-amt{width:74px;text-align:right;}
  .item{margin-bottom:7px;}
  .item .name{font-weight:500;}
  .item .sub{display:flex;color:#333;padding-left:8px;}
  .item .sub .col-unit{flex:1;text-align:left;}
  .item .sub .col-qty{width:26px;text-align:center;}
  .item .sub .col-amt{width:74px;text-align:right;}
  .total-row{display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin:4px 0 2px;}
  .thanks{text-align:center;margin-top:16px;font-size:12px;}
  .thanks .l2{font-size:10.5px;color:#666;margin-top:3px;}
  .barcode{display:flex;justify-content:center;margin-top:14px;}
  .exempt-note{font-size:10.5px;color:#555;margin-top:8px;}

  footer{text-align:center;margin-top:26px;font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>영수증 랜덤 생성기</h1>
    <p>업종을 고르고, 각 항목을 직접 수정하거나 🎲로 랜덤 생성해보세요</p>
  </header>

  <div class="panel">
    <label for="typeSelect">업종</label>
    <select id="typeSelect">
      <option value="random">🎲 전체 랜덤</option>
      <option value="convenience">편의점</option>
      <option value="cafe">카페</option>
      <option value="restaurant">식당</option>
      <option value="gas">주유소</option>
      <option value="mart">마트</option>
      <option value="stationery">문구점</option>
      <option value="taxi">택시</option>
      <option value="bookstore">서점</option>
      <option value="pharmacy">약국</option>
      <option value="hotel">호텔</option>
    </select>

    <div id="styleToggle">
      <button data-style="photo" class="active">사진형</button>
      <button data-style="flat">플랫형</button>
    </div>

    <button class="primary" id="genBtn">전체 새로 생성</button>
    <button class="ghost" id="pngBtn">PNG로 저장</button>
  </div>

  <div class="layout">
    <div class="form-panel" id="formPanel"></div>
    <div class="stage-col">
      <div class="stage photo" id="stage">
        <div class="receipt" id="receipt"></div>
      </div>
    </div>
  </div>

  <footer>썸네일/블로그용 목업이며 실제 결제·매출 자료가 아닙니다.</footer>
</div>

<script>
/* ================= helpers ================= */
const rnd = (min,max)=> Math.floor(Math.random()*(max-min+1))+min;
const pick = arr => arr[rnd(0,arr.length-1)];
const comma = n => Number(n||0).toLocaleString('ko-KR');
const pad = (n,len)=> String(n).padStart(len,'0');
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function getPath(obj, path){ return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj); }
function setPath(obj, path, value){
  const keys = path.split('.');
  let o = obj;
  for(let i=0;i<keys.length-1;i++) o = o[keys[i]];
  o[keys[keys.length-1]] = value;
}

const SURNAMES = ['김','이','박','최','정','강','조','윤','장','임','한','오','서','신','권'];
const GIVEN1 = ['민','서','지','현','수','태','호','재','영','은','도','유','승','다','혜'];
const GIVEN2 = ['준','호','아','우','진','희','원','훈','연','민','석','빈','율','경','만'];
const randomName = ()=> pick(SURNAMES)+pick(GIVEN1)+pick(GIVEN2);

const GUS = ['강남구','서초구','송파구','마포구','영등포구','성동구'];
const ROADS = ['테헤란로','도곡로','학동로','선릉로','서초대로','봉은사로','강남대로','언주로'];
const FLOORS = ['1층','2층','지하1층',''];
const randomAddress = (city='서울')=> `${city} ${pick(GUS)} ${pick(ROADS)} ${rnd(10,450)}${pick(FLOORS)?(' '+pick(FLOORS)):''}`;

const HOTEL_CITIES = [
  {city:'서울', gu:'중구', road:'소공로', area:'02'},
  {city:'부산', gu:'해운대구', road:'해운대해변로', area:'051'},
  {city:'제주', gu:'제주시', road:'노형로', area:'064'},
  {city:'경주', gu:'보문로', road:'보문단지길', area:'054'},
  {city:'인천', gu:'중구', road:'월미로', area:'032'}
];
function randomHotelAddrPhone(){
  const h = pick(HOTEL_CITIES);
  return { addr:`${h.city} ${h.gu} ${h.road} ${rnd(10,400)}`, phone: randomPhone(h.area) };
}

const randomPhone = (area='02')=> `${area}-${rnd(area==='02'?300:200,area==='02'?599:999)}-${rnd(1000,9999)}`;
const randomBizNo = ()=> `${rnd(100,999)}-${rnd(10,99)}-${rnd(10000,99999)}`;
const randomPOS = ()=> `POS0${rnd(1,9)} / ${pad(rnd(1000,9999999),7)}`;
const randomApproval = ()=> String(rnd(10000000,99999999));
const randomCardNo = ()=> `${rnd(1000,9999)}-${rnd(10,99)}**-****-${rnd(1000,9999)}`;
const randomCashId = ()=> `${rnd(100,999)}-${pad(rnd(1,99999),5)}`;
const randomCarPlate = ()=> `${rnd(11,99)}${pick(['가','나','다','라','마','바','사','아'])} ${rnd(1000,9999)}`;
const randomTaxiPlate = ()=> `서울 ${rnd(10,99)}${pick(['가','나','다','라','바','사','아','자'])} ${rnd(1000,9999)}`;
const CARD_CO = ['국민카드','신한카드','하나카드','삼성카드','현대카드','우리카드'];
const INSTALLMENTS = ['일시불','2개월','3개월','6개월'];

function randomDateTime(){
  const month = rnd(6,8), day = month===8? rnd(1,6) : rnd(1,28);
  const h = rnd(7,22), m = rnd(0,59), s = rnd(0,59);
  return `2026-${pad(month,2)}-${pad(day,2)} ${pad(h,2)}:${pad(m,2)}:${pad(s,2)}`;
}
function taxSplit(total){
  const supply = Math.round(total/1.1);
  return { supply, vat: total - supply };
}
function buildPayment(){
  const method = pick(['법인카드','신용카드','신용카드','현금']);
  if(method === '현금') return {method, cash:true, id:randomCashId(), approval:randomApproval()};
  return {method, cash:false, card:pick(CARD_CO), cardNo:randomCardNo(), approval:randomApproval(), installment:'일시불'};
}

/* ================= business pools ================= */
const BRANCHES = ['강남점','역삼점','논현점','선릉점','서초점','교대점','신사점','삼성점','대치점','도곡점'];

const BUSINESS = {
  convenience:{ label:'편의점', names:['한빛편의점','드림24','해피스토어','스마일편의점','굿모닝마트24','365편의점'],
    items:[['아메리카노(캔) 275ml',1500],['삼각김밥 참치마요',1300],['생수 500ml',800],['초코과자',1700],
      ['컵라면',1600],['우유 200ml',1400],['박카스',1000],['핫바',1800]] },
  cafe:{ label:'카페', names:['카페 리브레','모카하우스','카페 브라운','선셋카페','카페 아로마','블랑카페'],
    items:[['아메리카노(HOT)',4500],['아메리카노(ICE)',4500],['카페라떼(ICE)',5000],['카페라떼(HOT)',5000],
      ['바닐라라떼',5500],['카푸치노',5000],['딸기스무디',6000],['크로플',6500]] },
  restaurant:{ label:'식당', names:['본가설렁탕','명동칼국수','조선왕곱창','다정국밥','제일순대국','전주비빔밥'],
    items:[['설렁탕',11000],['공기밥 추가',1000],['수육(소)',25000],['김치찌개',9000],
      ['된장찌개',8000],['냉면',9500],['갈비탕',13000]] },
  mart:{ label:'마트', names:['그린마트','행복마트','우리마트','365마트','다있소마트','알뜰마트'],
    items:[['A4 복사용지 2500매',22900],['종이컵 6.5oz 500개',8900],['커피믹스 100T',13800],
      ['생수 2L 6개입',4500],['물티슈 100매',3500],['쓰레기봉투 20L',4000],['키친타월 2롤',3200]] },
  stationery:{ label:'문구점', names:['알파문구','오피스코리아','문구천국','굿모닝문구','한샘문구'],
    items:[['스프링노트 A5',3000],['유성볼펜 0.7mm 흑',1200],['클리어파일홀더',2500],
      ['포스트잇',2000],['네임펜',1500],['수정테이프',2200],['형광펜 세트',3500]] },
  bookstore:{ label:'서점', names:['밀알서점','책방마루','교양서점','인문당서점','서가담서점'],
    items:[['경영전략의 기술',18000],['AI 시대의 조직운영',16800],['데이터 리터러시 입문',22000],
      ['글쓰기의 감각',15000],['파이썬 데이터분석',24000],['마케팅 불변의 법칙',17000]], exempt:true },
  pharmacy:{ label:'약국', names:['가온약국','튼튼약국','온누리약국','참사랑약국','해밀약국'],
    items:[['종합감기약(10정)',6800],['인후스프레이',5500],['소화제',4200],
      ['파스',3800],['구강청결제',6500],['비타민C',9900],['밴드 30매입',3200]] },
  hotel:{ label:'호텔', names:['그랜드스테이 호텔','오션뷰 호텔','시티팰리스 호텔','로얄파크 호텔'],
    items:[['스탠다드 더블 1박',132000],['디럭스 트윈 1박',158000],['스위트 1박',225000],
      ['조식 뷔페',15000],['스파 이용권',35000]] },
  gas:{ label:'주유소' },
  taxi:{ label:'택시' }
};
const GEN_TYPES = ['convenience','cafe','restaurant','mart','stationery','bookstore','pharmacy'];

function buildItems(pool, count){
  const chosen = [], used = new Set();
  count = Math.min(count, pool.length);
  while(chosen.length < count){
    const idx = rnd(0, pool.length-1);
    if(used.has(idx)) continue;
    used.add(idx);
    const [name, unit] = pool[idx];
    chosen.push({name, unit, qty: rnd(1,3)});
  }
  return chosen;
}
function randomItem(type){
  const pool = BUSINESS[type].items;
  const [name, unit] = pick(pool);
  return {name, unit, qty: rnd(1,3)};
}
function storeNameFor(type){
  const base = pick(BUSINESS[type].names);
  return /점$/.test(base) ? base.replace(/점$/, pick(BRANCHES)) : base + ' ' + pick(BRANCHES);
}

/* ================= state ================= */
let state = null;

function newState(type){
  if(type === 'gas'){
    return {
      type,
      storeName: pick(['행복','SK','GS칼텍스','현대오일뱅크','알뜰']) + '주유소 ' + pick(BRANCHES),
      rep: randomName(), addr: randomAddress(), phone: randomPhone('02'),
      bizNo: randomBizNo(), datetime: randomDateTime(), pos: randomPOS(),
      gas: { fuel: pick(['휘발유','경유']), pricePerL: rnd(1600,1780), liters:(rnd(150,500)/10).toFixed(2),
        plate: randomCarPlate(), pumpNo: rnd(1,8) },
      payment: buildPayment()
    };
  }
  if(type === 'taxi'){
    return {
      type,
      taxi:{ plate: randomTaxiPlate(), bizNo: randomBizNo(), driver: randomName(),
        day: rnd(1,28), pickupH: rnd(0,23), pickupM: rnd(0,59), durMin: rnd(5,45),
        km: (rnd(20,200)/10).toFixed(1), base: 4800, distFare: rnd(2000,15000), late:false },
      payment: buildPayment()
    };
  }
  const isHotel = type === 'hotel';
  const s = {
    type,
    storeName: storeNameFor(type),
    rep: randomName(),
    addr: isHotel ? randomHotelAddrPhone().addr : randomAddress(),
    phone: randomPhone('02'),
    bizNo: randomBizNo(),
    datetime: randomDateTime(),
    pos: isHotel ? `FO0${rnd(1,3)} / ${pad(rnd(1000,9999999),7)}` : randomPOS(),
    items: buildItems(BUSINESS[type].items, isHotel? rnd(1,2) : rnd(2,4)),
    note: type==='restaurant' ? `인원 ${rnd(1,5)}명 / 테이블 ${rnd(1,20)}번` : (type==='pharmacy' ? '일반의약품 / 처방전 없음' : ''),
    payment: buildPayment()
  };
  if(isHotel){
    const hp = randomHotelAddrPhone();
    s.addr = hp.addr; s.phone = hp.phone;
    s.hotel = { guest: randomName(), checkinDay: rnd(1,27) };
  }
  return s;
}

/* ================= randomizers (per field) ================= */
const RANDOMIZERS = {
  storeName: ()=>{ state.storeName = storeNameFor(state.type); },
  rep: ()=>{ state.rep = randomName(); },
  addr: ()=>{
    if(state.type === 'hotel'){ const hp = randomHotelAddrPhone(); state.addr = hp.addr; state.phone = hp.phone; }
    else state.addr = randomAddress();
  },
  phone: ()=>{ state.phone = randomPhone('02'); },
  bizNo: ()=>{ state.bizNo = randomBizNo(); },
  datetime: ()=>{ state.datetime = randomDateTime(); },
  pos: ()=>{ state.pos = state.type==='hotel' ? `FO0${rnd(1,3)} / ${pad(rnd(1000,9999999),7)}` : randomPOS(); },
  note: ()=>{ if(state.type==='restaurant') state.note = `인원 ${rnd(1,5)}명 / 테이블 ${rnd(1,20)}번`; },
  item: (idx)=>{ state.items[idx] = randomItem(state.type); },
  paymentMethod: ()=>{ state.payment = buildPayment(); },
  paymentDetail: ()=>{
    if(state.payment.cash){ state.payment.id = randomCashId(); state.payment.approval = randomApproval(); }
    else { state.payment.card = pick(CARD_CO); state.payment.cardNo = randomCardNo(); state.payment.approval = randomApproval();
      state.payment.installment = pick(INSTALLMENTS); }
  },
  hotelGuest: ()=>{ state.hotel.guest = randomName(); },
  hotelCheckin: ()=>{ state.hotel.checkinDay = rnd(1,27); },
  gasFuel: ()=>{ state.gas.fuel = pick(['휘발유','경유']); },
  gasPrice: ()=>{ state.gas.pricePerL = rnd(1600,1780); },
  gasLiters: ()=>{ state.gas.liters = (rnd(150,500)/10).toFixed(2); },
  gasPlate: ()=>{ state.gas.plate = randomCarPlate(); },
  gasPump: ()=>{ state.gas.pumpNo = rnd(1,8); },
  taxiPlate: ()=>{ state.taxi.plate = randomTaxiPlate(); },
  taxiBizNo: ()=>{ state.taxi.bizNo = randomBizNo(); },
  taxiDriver: ()=>{ state.taxi.driver = randomName(); },
  taxiPickup: ()=>{ state.taxi.day = rnd(1,28); state.taxi.pickupH = rnd(0,23); state.taxi.pickupM = rnd(0,59); },
  taxiDuration: ()=>{ state.taxi.durMin = rnd(5,45); },
  taxiKm: ()=>{ state.taxi.km = (rnd(20,200)/10).toFixed(1); },
  taxiBase: ()=>{ state.taxi.base = pick([3800,4300,4800]); },
  taxiDistFare: ()=>{ state.taxi.distFare = rnd(2000,15000); }
};

/* ================= form building ================= */
function tField(label, key, value, diceKey, idx){
  return `<div class="field"><label>${label}</label><div class="field-inline">
    <input type="text" data-key="${key}" value="${esc(value)}">
    ${diceKey?`<button class="dice" data-dice="${diceKey}"${idx!==undefined?` data-idx="${idx}"`:''} title="랜덤">🎲</button>`:''}
  </div></div>`;
}
function nField(label, key, value, diceKey, idx){
  return `<div class="field"><label>${label}</label><div class="field-inline">
    <input type="number" data-key="${key}" data-numeric="1" value="${esc(value)}">
    ${diceKey?`<button class="dice" data-dice="${diceKey}"${idx!==undefined?` data-idx="${idx}"`:''} title="랜덤">🎲</button>`:''}
  </div></div>`;
}

function storeInfoFields(){
  return `
    ${tField('상호명','storeName',state.storeName,'storeName')}
    ${tField('대표자','rep',state.rep,'rep')}
    ${tField('주소','addr',state.addr,'addr')}
    ${tField('전화번호','phone',state.phone,'phone')}
    ${tField('사업자번호','bizNo',state.bizNo,'bizNo')}
  `;
}
function transInfoFields(){
  return `
    ${tField('거래일시','datetime',state.datetime,'datetime')}
    ${tField('POS/거래번호','pos',state.pos,'pos')}
  `;
}
function itemsFields(){
  const rows = state.items.map((it,idx)=>`
    <div class="item-row">
      <button class="remove" data-action="remove-item" data-idx="${idx}">삭제</button>
      <div class="item-grid-name">
        <input type="text" data-key="items.${idx}.name" value="${esc(it.name)}">
        <button class="dice" data-dice="item" data-idx="${idx}" title="랜덤">🎲</button>
      </div>
      <div class="item-grid2">
        <div class="field"><label>단가</label><input type="number" data-numeric="1" data-key="items.${idx}.unit" value="${it.unit}"></div>
        <div class="field"><label>수량</label><input type="number" data-numeric="1" data-key="items.${idx}.qty" value="${it.qty}"></div>
      </div>
    </div>
  `).join('');
  return rows + `<button class="add-item" id="addItemBtn">+ 항목 추가</button>`;
}
function paymentFields(){
  const opts = ['법인카드','신용카드','현금'].map(m=>`<option value="${m}" ${state.payment.method===m?'selected':''}>${m}</option>`).join('');
  let detail;
  if(state.payment.cash){
    detail = `
      ${tField('현금영수증 식별번호','payment.id',state.payment.id,'paymentDetail')}
      ${tField('승인번호','payment.approval',state.payment.approval)}
    `;
  } else {
    const cardOpts = CARD_CO.map(c=>`<option value="${c}" ${state.payment.card===c?'selected':''}>${c}</option>`).join('');
    detail = `
      <div class="field"><label>카드사</label><div class="field-inline">
        <select data-key="payment.card">${cardOpts}</select>
        <button class="dice" data-dice="paymentDetail" title="랜덤">🎲</button>
      </div></div>
      ${tField('카드번호','payment.cardNo',state.payment.cardNo)}
      ${tField('승인번호','payment.approval',state.payment.approval)}
      <div class="field"><label>할부</label>
        <select data-key="payment.installment">${INSTALLMENTS.map(i=>`<option ${state.payment.installment===i?'selected':''}>${i}</option>`).join('')}</select>
      </div>
    `;
  }
  return `
    <div class="field"><label>결제수단</label><div class="field-inline">
      <select data-key="payment.method" data-rebuild="1">${opts}</select>
      <button class="dice" data-dice="paymentMethod" title="랜덤">🎲</button>
    </div></div>

  `;
}

  if(state.type === 'taxi'){
    const html = `<div class="section-h">택시 정보</div>
      ${tField('차량번호','taxi.plate',state.taxi.plate,'taxiPlate')}

      <div class="field"><label>승차 (일/시/분)</label><div class="field-inline">
        <input type="number" data-numeric="1" data-key="taxi.day" value="${state.taxi.day}" min="1" max="28" style="max-width:56px;">
        <input type="number" data-numeric="1" data-key="taxi.pickupH" value="${state.taxi.pickupH}" min="0" max="23" style="max-width:56px;">
        <input type="number" data-numeric="1" data-key="taxi.pickupM" value="${state.taxi.pickupM}" min="0" max="59" style="max-width:56px;">
        <button class="dice" data-dice="taxiPickup" title="랜덤">🎲</button>
      </div></div>
      ${nField('소요시간(분)','taxi.durMin',state.taxi.durMin,'taxiDuration')}
      ${tField('주행거리(km)','taxi.km',state.taxi.km,'taxiKm')}
      ${nField('기본요금','taxi.base',state.taxi.base,'taxiBase')}
      ${nField('거리/시간요금','taxi.distFare',state.taxi.distFare,'taxiDistFare')}
      <div class="checkbox-row"><input type="checkbox" id="lateCheck" ${state.taxi.late?'checked':''}><label for="lateCheck" style="margin:0;">심야할증(20%) 적용</label></div>
      <div class="section-h">결제 정보</div>${paymentFields()}`;
    el.innerHTML = html;
    bindEvents();
    return;
  }

  let html = `<div class="section-h">매장 정보</div>${storeInfoFields()}
    <div class="section-h">거래 정보</div>${transInfoFields()}`;

  if(state.type === 'gas'){
    html += `<div class="section-h">주유 정보</div>
      <div class="field"><label>유종</label><div class="field-inline">
        <select data-key="gas.fuel"><option ${state.gas.fuel==='휘발유'?'selected':''}>휘발유</option><option ${state.gas.fuel==='경유'?'selected':''}>경유</option></select>
        <button class="dice" data-dice="gasFuel" title="랜덤">🎲</button>
      </div></div>
      ${nField('리터당 단가(원)','gas.pricePerL',state.gas.pricePerL,'gasPrice')}
      ${tField('주유량(L)','gas.liters',state.gas.liters,'gasLiters')}
      ${tField('차량번호','gas.plate',state.gas.plate,'gasPlate')}
      ${nField('주유기 번호','gas.pumpNo',state.gas.pumpNo,'gasPump')}`;
  } else {
    html += `<div class="section-h">상품 목록</div>${itemsFields()}`;
    if(state.type === 'restaurant') html += `<div class="section-h">비고</div>${tField('안내 문구','note',state.note,'note')}`;
    if(state.type === 'hotel'){
      html += `<div class="section-h">투숙 정보</div>
        ${tField('투숙객','hotel.guest',state.hotel.guest,'hotelGuest')}
        ${nField('체크인 일(7월)','hotel.checkinDay',state.hotel.checkinDay,'hotelCheckin')}`;
    }
  }
  html += `<div class="section-h">결제 정보</div>${paymentFields()}`;
  el.innerHTML = html;
  bindEvents();
}

function bindEvents(){
  const el = document.getElementById('formPanel');
  el.oninput = e=>{
    const key = e.target.dataset.key;
    if(!key) return;
    let val = e.target.value;
    if(e.target.dataset.numeric) val = Number(val)||0;
    setPath(state, key, val);
    renderReceipt();
  };
  el.onchange = e=>{
    if(e.target.id === 'lateCheck'){ state.taxi.late = e.target.checked; renderReceipt(); return; }
    const key = e.target.dataset.key;
    if(!key) return;
    setPath(state, key, e.target.value);
    if(e.target.dataset.rebuild){ buildForm(); }
    renderReceipt();
  };
  el.onclick = e=>{
    const dice = e.target.closest('[data-dice]');
    if(dice){
      const fn = RANDOMIZERS[dice.dataset.dice];
      const idx = dice.dataset.idx!==undefined ? Number(dice.dataset.idx) : undefined;
      if(fn) fn(idx);
      buildForm();
      renderReceipt();
      return;
    }
    const action = e.target.closest('[data-action]');
    if(action){
      const idx = Number(action.dataset.idx);
      if(action.dataset.action === 'remove-item' && state.items.length>1){ state.items.splice(idx,1); }
      buildForm(); renderReceipt();
      return;
    }
    if(e.target.id === 'addItemBtn'){
      state.items.push(randomItem(state.type));
      buildForm(); renderReceipt();
    }
  };
}

/* ================= receipt rendering ================= */
function barcodeSvg(){
  let bars = '', x = 0;
  const total = rnd(55,70);
  for(let i=0;i<total;i++){
    const w = pick([1,1,1,2,2,3]);
    if(i%2===0) bars += `<rect x="${x}" y="0" width="${w}" height="42" fill="#111"/>`;
    x += w;
  }
  return `<svg width="${x}" height="42" viewBox="0 0 ${x} 42">${bars}</svg>`;
}
function headerHtml(name){ return `<div class="r-store">${esc(name)}</div><div class="r-title">영&nbsp;&nbsp;수&nbsp;&nbsp;증</div>`; }
function bizInfoHtml(){
  return `<div class="row"><span class="k">사업자번호</span><span class="v">${esc(state.bizNo)}</span></div>

    <div class="row"><span class="k">전화번호</span><span class="v">${esc(state.phone)}</span></div>`;

function paymentHtml(){

  if(p.cash){
    html += `<div class="row"><span class="k">현금영수증</span><span class="v">지출증빙</span></div>

function renderReceipt(){
  let html;
  if(state.type === 'gas') html = renderGas();
  else if(state.type === 'taxi') html = renderTaxi();
  else html = renderGeneric();
  document.getElementById('receipt').innerHTML = html;
}

  const total = state.items.reduce((s,i)=> s + i.unit*i.qty, 0);
  const itemsHtml = state.items.map(i=>{
    const amount = i.unit*i.qty;
    return `<div class="item"><div class="name">${esc(i.name)}</div>
      <div class="sub"><span class="col-unit">${comma(i.unit)}</span><span class="col-qty">${i.qty}</span><span class="col-amt">${comma(amount)}</span></div></div>`;
  }).join('');
  let taxBlock;

    taxBlock = `<div class="row"><span class="k">면세물품가액</span><span class="v">${comma(total)}</span></div>
      <div class="row"><span class="k">부&nbsp;&nbsp;가&nbsp;&nbsp;세</span><span class="v">0</span></div>`;

  if(state.type === 'pharmacy') extra = `<div class="exempt-note">${esc(state.note)}</div>`;
  if(state.type === 'restaurant') extra = `<div class="exempt-note">${esc(state.note)}</div>`;
  if(state.type === 'hotel') extra = `<div class="exempt-note">투숙객&nbsp;&nbsp;${esc(state.hotel.guest)}<br>체크인 07-${pad(state.hotel.checkinDay,2)} 15:00 / 체크아웃 07-${pad(Number(state.hotel.checkinDay)+1,2)} 11:00</div>`;

  const lateFee = t.late ? Math.round((Number(t.base)+Number(t.distFare))*0.2/100)*100 : 0;
  const total = Number(t.base)+Number(t.distFare)+lateFee;
  return `

/* ================= wiring ================= */
const TYPE_KEYS = ['convenience','cafe','restaurant','gas','mart','stationery','taxi','bookstore','pharmacy','hotel'];

function fullRegenerate(){
  const sel = document.getElementById('typeSelect').value;
  const type = sel === 'random' ? pick(TYPE_KEYS) : sel;
  state = newState(type);
  buildForm();
  renderReceipt();
}

document.getElementById('typeSelect').addEventListener('change', fullRegenerate);
document.getElementById('genBtn').addEventListener('click', fullRegenerate);

document.querySelectorAll('#styleToggle button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#styleToggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const stage = document.getElementById('stage');
    stage.classList.remove('photo','flat');
    stage.classList.add(btn.dataset.style);
  });
});

document.getElementById('pngBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('pngBtn');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = '저장 중...';
  try{
    await window.html2canvasReady;
    if(typeof html2canvas === 'undefined'){
      throw new Error('html2canvas 라이브러리를 불러오지 못했습니다 (네트워크/차단 문제일 수 있어요)');
    }
    const target = document.getElementById('stage');
    const canvas = await html2canvas(target, {backgroundColor:null, scale:2, useCORS:true});
    await new Promise((resolve, reject)=>{
      canvas.toBlob(blob=>{
        if(!blob){ reject(new Error('이미지 변환에 실패했습니다')); return; }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = 'receipt_' + Date.now() + '.png';
        link.href = url;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        resolve();
      }, 'image/png');
    });
  } catch(err){
    console.error(err);
    alert('PNG 저장에 실패했습니다. 인터넷 연결을 확인한 뒤 다시 시도해주세요.\n(' + err.message + ')');
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
});

fullRegenerate();
</script>
