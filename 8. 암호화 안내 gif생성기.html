:root{
  --bg:#eceff4; --panel:#ffffff; --line:#dde2ea; --ink:#18202f; --ink2:#5a6578; --accent:#1d6fe0; --accent-ink:#ffffff; --soft:#f4f6fa;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1119; --panel:#151a25; --line:#262e3d; --ink:#e7ebf3; --ink2:#95a1b6; --accent:#4b8cff; --accent-ink:#071126; --soft:#1b2130;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1119; --panel:#151a25; --line:#262e3d; --ink:#e7ebf3; --ink2:#95a1b6; --accent:#4b8cff; --accent-ink:#071126; --soft:#1b2130;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:392px minmax(0,1fr);min-height:100vh}
.panel{background:var(--panel);border-right:1px solid var(--line);padding:22px 20px 40px}
.panel h1{font-size:18px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.panel .sub{margin:0 0 20px;color:var(--ink2);font-size:12.5px}
.sec{padding:16px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;padding-top:0}
.sec h2{font-size:13px;font-weight:700;margin:0 0 10px;color:var(--ink)}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thumb{appearance:none;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:6px 6px 8px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s}
.thumb canvas{width:100%;height:auto;border-radius:6px;display:block;background:#fff}
.thumb .tn{font-size:12.5px;font-weight:600;padding:0 2px;line-height:1.25}
.thumb .td{font-size:11px;color:var(--ink2);padding:0 2px;margin-top:-4px}
.thumb:hover{border-color:var(--ink2)}
.thumb[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.thumb:focus-visible,.seg button:focus-visible,.chip:focus-visible,.btn:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea,select{width:100%;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:9px 10px;font:inherit;font-size:13.5px}
textarea{resize:vertical;min-height:62px;line-height:1.45}
.hint{margin:6px 0 0;font-size:11.5px;color:var(--ink2)}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.lab{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink2);margin-bottom:5px}
.lab output{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink2);padding:7px 4px;border-radius:6px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:5px 11px 5px 6px;font:inherit;font-size:12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip i{width:16px;height:16px;border-radius:50%;display:block;border:1px solid var(--line)}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.colors label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.colors input[type=color]{width:100%;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--soft);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.btn{appearance:none;width:100%;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:14.5px;font-weight:700;padding:13px 14px;border-radius:10px;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line);font-weight:600;font-size:13.5px;padding:10px}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:10px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .12s}
.result{display:none;margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft)}
.result img{display:block;max-width:100%;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff;margin:0 auto 8px}
.result .meta{font-size:12px;color:var(--ink2);margin-bottom:8px}
.note{font-size:11.5px;color:var(--ink2);margin:8px 0 0}
.stage{position:sticky;top:0;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:12px}
.pv{max-width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
#pv{display:block;border:1px solid var(--line);border-radius:6px;max-width:100%;height:auto;box-shadow:0 1px 2px rgba(0,0,0,.05),0 12px 32px -16px rgba(0,0,0,.25)}
.cap{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .stage{order:-1;height:auto;padding:12px;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);gap:6px}
  #pv{max-height:34vh;width:auto}
  .panel{border-right:0;padding:18px 16px 40px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>암호화 안내 GIF 생성기</h1>
    <p class="sub">오비탈 링과 단계 진행바를 맞춰 GIF로 저장하세요.</p>

    <section class="sec">
      <h2>자물쇠 모양</h2>
      <div class="thumbs" id="thumbs"></div>
    </section>

    <section class="sec">
      <h2>진행바</h2>
      <div class="field">
        <div class="seg" id="barSeg"><button type="button" data-v="1">단계 진행바 표시</button><button type="button" data-v="0">숨김</button></div>
        <p class="hint">칸 수와 속도는 아래 '크기와 속도'에서 조절해요. 칸이 하나씩 차례로 채워져요.</p>
      </div>
    </section>

    <section class="sec">
      <h2>문구</h2>
      <div class="field">
        <textarea id="text" rows="2" spellcheck="false"></textarea>
        <p class="hint">단어를 [[ ]]로 감싸면 강조색 굵은 글씨가 돼요. 줄바꿈도 가능해요.</p>
      </div>
      <div class="field">
        <div class="lab"><span>배치</span></div>
        <div class="seg" id="layoutSeg">
          <button type="button" data-v="v">세로형 (아이콘 위)</button>
          <button type="button" data-v="h">가로형 (아이콘 왼쪽)</button>
        </div>
      </div>
      <div class="two">
        <div class="field"><div class="lab"><span>글꼴</span></div>
          <select id="font">
            <option value="Pretendard">프리텐다드</option>
            <option value="Noto Sans KR">Noto Sans KR</option>
            <option value="IBM Plex Sans KR">IBM Plex Sans KR</option>
            <option value="Gothic A1">Gothic A1</option>
            <option value="Nanum Gothic">나눔고딕</option>
          </select>
        </div>
        <div class="field"><div class="lab"><span>굵기</span></div>
          <select id="weight">
            <option value="300">가늘게</option>
            <option value="400">보통</option>
            <option value="500">중간</option>
            <option value="700">굵게</option>
          </select>
        </div>
      </div>
    </section>

    <section class="sec">
      <h2>색상</h2>
      <div class="chips" id="chips"></div>
      <div class="colors">
        <label>메인색<input type="color" id="cMain"></label>
        <label>배경색<input type="color" id="cBg"></label>
        <label>글자색<input type="color" id="cInk"></label>
      </div>
    </section>

    <section class="sec">
      <h2>크기와 속도</h2>
      <div id="sliders"></div>
      <div class="two">
        <div class="field"><div class="lab"><span>선명도</span></div>
          <div class="seg" id="resSeg"><button type="button" data-v="1">표준</button><button type="button" data-v="2">선명 2x</button></div>
        </div>
        <div class="field"><div class="lab"><span>프레임</span></div>
          <div class="seg" id="fpsSeg"><button type="button" data-v="15">15</button><button type="button" data-v="20">20</button><button type="button" data-v="25">25</button></div>
        </div>
      </div>
    </section>

    <section class="sec">
      <button class="btn" id="make" type="button">GIF 만들기</button>
      <div class="bar" id="bar"><i id="barI"></i></div>
      <div class="result" id="result">
        <img id="resImg" alt="완성된 GIF">
        <div class="meta" id="resMeta"></div>
        <button class="btn ghost" id="save" type="button">GIF 파일 다운로드</button>
      </div>
      <p class="note">완성된 GIF는 티스토리 에디터에 이미지로 올리면 계속 반복 재생돼요.</p>
    </section>
  </aside>

  <main class="stage">
    <div class="pv">
      <canvas id="pv"></canvas>
      <div class="cap" id="cap"></div>
    </div>
  </main>
</div>

<script>
(function(){
'use strict';

/* ---------- 유틸 ---------- */
var $=function(s){return document.querySelector(s)};
var clamp=function(x,a,b){a=a===undefined?0:a;b=b===undefined?1:b;return Math.min(b,Math.max(a,x))};
var seg=function(t,a,b){return clamp((t-a)/(b-a))};
var eOut=function(x){return 1-Math.pow(1-x,3)};
var eIO=function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
var eBack=function(x){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
var fadeIO=function(t){return seg(t,0,.05)*(1-seg(t,.94,1))};
var TAU=Math.PI*2;
var RES=1;
var tick=function(){return new Promise(function(r){setTimeout(r,0)})};

function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');var n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255]}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(function(v){v=Math.round(clamp(v,0,255));return (v<16?'0':'')+v.toString(16)}).join('')}
function mix(a,b,t){var A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}
function rgba(h,a){var c=hexToRgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
function lum(h){var c=hexToRgb(h);return (0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255}
function hsh(n){n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return (n>>>0)/4294967296}
function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function theme(S){
  var m=S.main,dark=lum(S.bg)<0.45;
  return {main:m,light:mix(m,'#ffffff',dark?0.35:0.55),deep:mix(m,'#000000',0.28),
    soft:mix(S.bg,m,dark?0.24:0.2),faint:mix(S.bg,m,dark?0.1:0.07),line:mix(S.bg,m,dark?0.34:0.3),
    bg:S.bg,ink:S.ink,dark:dark};
}

/* ---------- 자물쇠 (8가지 모양) ---------- */
var LOCKKIND='classic';
var LOCKS=[
  {id:'classic',name:'① 클래식',desc:'입체 그라데이션 바디'},
  {id:'round',name:'② 라운드',desc:'통통한 둥근 바디'},
  {id:'line',name:'③ 라인아트',desc:'가는 선 윤곽'},
  {id:'shield',name:'④ 방패 바디',desc:'아래가 뾰족한 보안형'},
  {id:'duo',name:'⑤ 듀얼톤',desc:'위아래 두 톤 플랫'},
  {id:'hex',name:'⑥ 헥사곤',desc:'육각형 기하학형'},
  {id:'glass',name:'⑦ 글래스',desc:'반투명 유리 질감'},
  {id:'coin',name:'⑧ 코인',desc:'원형 바디'}
];
function drawLock(ctx,cx,cy,s,o){
  var T=o.T,open=o.open||0,col=o.color||T.main,kind=o.kind||LOCKKIND;
  var lw=s*0.105,half=0.22;
  var bx=cx-0.36*s,by=cy-0.04*s,bw=0.72*s,bh=0.54*s;
  if(kind==='round'){lw=s*0.125;bx=cx-0.39*s;bw=0.78*s;bh=0.56*s}
  if(kind==='line')lw=s*0.088;
  if(kind==='glass')lw=s*0.09;
  if(kind==='coin'){lw=s*0.11;half=0.2}
  var baseY=by+lw*0.2;
  if(kind==='coin')baseY=cy-0.16*s;
  var x1=cx-half*s,x2=cx+half*s,acy=cy-0.30*s,r=half*s;
  function grad(y0,y1,c0,c1){var g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c0);g.addColorStop(1,c1);return g}
  function hole(kx,ky,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.arc(kx,ky,0.07*s,0,TAU);ctx.fill();rr(ctx,kx-0.025*s,ky,0.05*s,0.17*s,0.025*s);ctx.fill()}
  var bodyCol=mix(col,'#ffffff',0.18),bodyDeep=mix(col,'#000000',0.22);
  /* 걸쇠 */
  ctx.save();
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=lw;
  ctx.strokeStyle=kind==='glass'?rgba(col,0.9):col;
  ctx.translate(0,-open*0.035*s);
  ctx.translate(x1,baseY);ctx.rotate(-open*0.5);ctx.translate(-x1,-baseY);
  ctx.beginPath();ctx.moveTo(x1,baseY);ctx.lineTo(x1,acy);ctx.arc(cx,acy,r,Math.PI,0);ctx.lineTo(x2,baseY);ctx.stroke();
  ctx.restore();
  /* 바디 */
  ctx.save();
  if(kind==='classic'){
    ctx.fillStyle=grad(by,by+bh,bodyCol,bodyDeep);rr(ctx,bx,by,bw,bh,0.1*s);ctx.fill();
    hole(cx,by+bh*0.4,T.bg);
  }else if(kind==='round'){
    ctx.fillStyle=grad(by,by+bh,bodyCol,bodyDeep);rr(ctx,bx,by,bw,bh,0.22*s);ctx.fill();
    hole(cx,by+bh*0.4,T.bg);
  }else if(kind==='line'){
    ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.lineJoin='round';
    rr(ctx,bx+lw/2,by+lw/2,bw-lw,bh-lw,0.1*s);ctx.stroke();
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,by+bh*0.42,0.058*s,0,TAU);ctx.fill();
    ctx.lineCap='round';ctx.lineWidth=0.07*s;ctx.beginPath();ctx.moveTo(cx,by+bh*0.45);ctx.lineTo(cx,by+bh*0.68);ctx.stroke();
  }else if(kind==='shield'){
    var br=0.08*s;
    ctx.beginPath();ctx.moveTo(bx+br,by);ctx.lineTo(bx+bw-br,by);ctx.quadraticCurveTo(bx+bw,by,bx+bw,by+br);
    ctx.lineTo(bx+bw,by+bh*0.55);ctx.quadraticCurveTo(bx+bw,by+bh*0.95,cx,by+bh*1.1);
    ctx.quadraticCurveTo(bx,by+bh*0.95,bx,by+bh*0.55);ctx.lineTo(bx,by+br);ctx.quadraticCurveTo(bx,by,bx+br,by);ctx.closePath();
    ctx.fillStyle=grad(by,by+bh*1.1,bodyCol,bodyDeep);ctx.fill();
    hole(cx,by+bh*0.38,T.bg);
  }else if(kind==='duo'){
    rr(ctx,bx,by,bw,bh,0.1*s);ctx.clip();
    ctx.fillStyle=T.light;ctx.fillRect(bx,by,bw,bh*0.45);
    ctx.fillStyle=col;ctx.fillRect(bx,by+bh*0.45,bw,bh*0.56);
    ctx.restore();ctx.save();
    hole(cx,by+bh*0.4,T.bg);
  }else if(kind==='hex'){
    var cy2=by+0.29*s,rx=0.4*s,ry=0.335*s;
    ctx.beginPath();for(var i=0;i<6;i++){var a=i*Math.PI/3,px=cx+rx*Math.cos(a),py=cy2+ry*Math.sin(a);i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();
    ctx.fillStyle=grad(by,by+bh,bodyCol,bodyDeep);ctx.fill();
    ctx.lineJoin='round';ctx.lineWidth=0.07*s;ctx.strokeStyle=bodyDeep;ctx.stroke();
    hole(cx,cy2-0.1*s,T.bg);
  }else if(kind==='glass'){
    rr(ctx,bx,by,bw,bh,0.14*s);
    ctx.fillStyle=grad(by,by+bh,rgba(col,0.42),rgba(col,0.14));ctx.fill();
    ctx.lineWidth=s*0.03;ctx.strokeStyle=rgba(col,0.85);ctx.stroke();
    ctx.save();rr(ctx,bx,by,bw,bh,0.14*s);ctx.clip();
    ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=s*0.05;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(bx+bw*0.12,by+bh*0.78);ctx.lineTo(bx+bw*0.42,by+bh*0.12);ctx.stroke();ctx.restore();
    hole(cx,by+bh*0.42,col);
  }else if(kind==='coin'){
    var ccy=cy+0.16*s,cr=0.42*s;
    ctx.beginPath();ctx.arc(cx,ccy,cr,0,TAU);ctx.fillStyle=grad(ccy-cr,ccy+cr,bodyCol,bodyDeep);ctx.fill();
    ctx.lineWidth=s*0.025;ctx.strokeStyle=rgba('#ffffff',0.35);ctx.beginPath();ctx.arc(cx,ccy,cr*0.82,0,TAU);ctx.stroke();
    hole(cx,ccy-0.1*s,T.bg);
  }
  ctx.restore();
}

/* ---------- 오비탈 링 + 단계 진행바 ---------- */
var STEPS=7,SHOWBAR=true;
var ORBITS=[[1,1,0,3],[1,-1,0.5,3],[0.78,2,0.2,2.6],[0.78,-2,0.7,2.6]];
function sOrbit(ctx,box,t,T,k){
  var cx=box.x+box.w/2,bar=SHOWBAR,n=STEPS;
  var R=Math.min(box.h/(bar?2.55:2.1)*k,box.w*0.4);
  var barH=Math.max(4,R*0.1),gap=R*0.32,total=2*R+(bar?gap+barH:0);
  var top=box.y+(box.h-total)/2,cy=top+R;
  ctx.save();
  ctx.strokeStyle=T.soft;ctx.lineWidth=2;
  [1,0.78].forEach(function(m){ctx.beginPath();ctx.arc(cx,cy,R*m,0,TAU);ctx.stroke()});
  ctx.fillStyle=T.faint;ctx.beginPath();ctx.arc(cx,cy,R*0.7,0,TAU);ctx.fill();
  ctx.lineCap='round';
  ORBITS.forEach(function(o){
    var r=R*o[0],th=TAU*(o[1]*t+o[2]),dir=o[1]>0?1:-1,lw=o[3];
    for(var j=0;j<18;j++){
      var a0=th-dir*(j+1)*0.06,a1=th-dir*j*0.06;
      ctx.strokeStyle=rgba(T.main,(1-j/18)*0.7);ctx.lineWidth=lw;
      ctx.beginPath();ctx.arc(cx,cy,r,Math.min(a0,a1),Math.max(a0,a1));ctx.stroke();
    }
    ctx.save();ctx.shadowColor=T.main;ctx.shadowBlur=12*RES;ctx.fillStyle=T.light;
    ctx.beginPath();ctx.arc(cx+Math.cos(th)*r,cy+Math.sin(th)*r,lw*1.15,0,TAU);ctx.fill();ctx.restore();
  });
  var pu=1+0.03*Math.sin(TAU*t);
  ctx.save();ctx.translate(cx,cy);ctx.scale(pu,pu);drawLock(ctx,0,0,R*0.74,{T:T,open:0});ctx.restore();
  if(bar){
    var barY=cy+R+gap,barW=Math.min(box.w*0.8,R*3.6),sg=barW*0.026,sw=(barW-sg*(n-1))/n;
    ctx.save();
    var u=seg(t,0.03,0.88),P=n*(u*u*(3-2*u));
    for(var i=0;i<n;i++){
      var x=cx-barW/2+i*(sw+sg);
      ctx.fillStyle=T.soft;rr(ctx,x,barY,sw,barH,barH*0.18);ctx.fill();
      var fl=clamp(P-i);
      if(fl>0){
        ctx.fillStyle=mix(T.light,T.main,Math.max(clamp((P-i-1)/1.6),seg(t,0.88,0.95)));
        ctx.save();rr(ctx,x,barY,sw,barH,barH*0.18);ctx.clip();ctx.fillRect(x,barY,sw*fl,barH);ctx.restore();
      }
    }
    ctx.restore();
  }
  ctx.restore();
}

var STYLES=[{id:'orbit',name:'오비탈 링',desc:'궤도를 도는 보호막',fn:sOrbit}];

/* ---------- 상태 ---------- */
var PRESETS=[
  {n:'딥 네이비',main:'#14407a',bg:'#ffffff',ink:'#3a4252'},
  {n:'블루',main:'#2f89e3',bg:'#ffffff',ink:'#444444'},
  {n:'인디고',main:'#5457d6',bg:'#ffffff',ink:'#383a4d'},
  {n:'그린',main:'#12a67a',bg:'#ffffff',ink:'#3a4944'},
  {n:'퍼플',main:'#8a5cf6',bg:'#ffffff',ink:'#403a52'},
  {n:'네이비 골드',main:'#f2b134',bg:'#101c36',ink:'#e8edf8'},
  {n:'네온 다크',main:'#22d3ee',bg:'#0b1018',ink:'#cfe6ee'}
];
var S={style:'segments',text:'입력하신 개인정보는 암호화되어 안전하게 처리됩니다.',layout:'v',font:'Pretendard',weight:400,
  main:'#2f89e3',bg:'#ffffff',ink:'#444444',w:800,h:270,icon:100,fs:24,dur:4,res:1,fps:20,bar:1,steps:7,lock:'classic'};

/* ---------- 텍스트·레이아웃 ---------- */
function parseLine(l){var runs=[],re=/\[\[(.+?)\]\]/g,last=0,m;while((m=re.exec(l))){if(m.index>last)runs.push({t:l.slice(last,m.index),hl:false});runs.push({t:m[1],hl:true});last=re.lastIndex}if(last<l.length)runs.push({t:l.slice(last),hl:false});return runs}
function fontOf(S,size,hl){return (hl?Math.max(S.weight,700):S.weight)+' '+size+'px "'+S.font+'","Noto Sans KR",sans-serif'}
function measure(ctx,S,availW){
  var parsed=S.text.split('\n').map(parseLine);
  function widths(size){return parsed.map(function(runs){return runs.reduce(function(a,r){ctx.font=fontOf(S,size,r.hl);return a+ctx.measureText(r.t).width},0)})}
  var fs=S.fs,ws=widths(fs),mx=Math.max.apply(null,ws.concat([1])),f=Math.min(1,availW/mx);
  if(f<1){fs=S.fs*f;ws=widths(fs);mx=Math.max.apply(null,ws.concat([1]))}
  return {parsed:parsed,ws:ws,mx:mx,fs:fs,lineH:fs*1.5};
}
function drawText(ctx,S,T,M,left,cx,topY,align){
  ctx.textBaseline='middle';ctx.textAlign='left';
  M.parsed.forEach(function(runs,i){
    var x=align==='center'?cx-M.ws[i]/2:left,y=topY+M.lineH*(i+0.5);
    runs.forEach(function(r){
      ctx.font=fontOf(S,M.fs,r.hl);ctx.fillStyle=r.hl?T.main:T.ink;
      ctx.fillText(r.t,x,y);x+=ctx.measureText(r.t).width;
    });
  });
}
function styleFn(id){for(var i=0;i<STYLES.length;i++)if(STYLES[i].id===id)return STYLES[i].fn;return STYLES[0].fn}

function drawFrame(ctx,S,t,res){
  var W=S.w,H=S.h,T=theme(S),k=S.icon/100;RES=res;LOCKKIND=S.lock||'classic';STEPS=Math.round(S.steps);SHOWBAR=!!S.bar;
  ctx.setTransform(res,0,0,res,0,0);ctx.globalAlpha=1;ctx.fillStyle=S.bg;ctx.fillRect(0,0,W,H);
  var fn=styleFn(S.style);
  if(S.layout==='h'){
    var padX=W*0.04,gapX=W*0.03,boxW=Math.min(H*1.1,W*0.4);
    var M=measure(ctx,S,W-padX*2-boxW-gapX);
    var gW=boxW+gapX+M.mx,x0=(W-gW)/2;
    fn(ctx,{x:x0,y:H*0.06,w:boxW,h:H*0.88},t,T,k);
    var th=M.lineH*M.parsed.length;
    drawText(ctx,S,T,M,x0+boxW+gapX,0,(H-th)/2,'left');
  }else{
    var pad=H*0.07,gap=H*0.02;
    var M2=measure(ctx,S,W*0.92),th2=M2.lineH*M2.parsed.length;
    var boxH=Math.max(H*0.2,H-pad*2-th2-gap);
    fn(ctx,{x:0,y:pad,w:W,h:boxH},t,T,k);
    drawText(ctx,S,T,M2,0,W/2,pad+boxH+gap,'center');
  }
  ctx.globalAlpha=1;
}
/* ---------- GIF 인코더 ---------- */
function medianCut(bins,n){
  var boxes=[bins.slice()];
  while(boxes.length<n){
    var bi=-1,bs=0,bch=0;
    for(var i=0;i<boxes.length;i++){
      var b=boxes[i];if(b.length<2)continue;
      var mn=[255,255,255],mxv=[0,0,0],tot=0;
      for(var j=0;j<b.length;j++){var p=b[j];tot+=p.n;
        if(p.r<mn[0])mn[0]=p.r;if(p.r>mxv[0])mxv[0]=p.r;
        if(p.g<mn[1])mn[1]=p.g;if(p.g>mxv[1])mxv[1]=p.g;
        if(p.b<mn[2])mn[2]=p.b;if(p.b>mxv[2])mxv[2]=p.b}
      var rg=[mxv[0]-mn[0],mxv[1]-mn[1],mxv[2]-mn[2]],m=Math.max(rg[0],rg[1],rg[2]),sc=m*Math.sqrt(tot);
      if(sc>bs){bs=sc;bi=i;bch=rg[0]>=rg[1]&&rg[0]>=rg[2]?'r':rg[1]>=rg[2]?'g':'b'}
    }
    if(bi<0)break;
    var bx=boxes[bi];bx.sort(function(a,b){return a[bch]-b[bch]});
    var half=bx.reduce(function(a,p){return a+p.n},0)/2,cum=0,idx=1;
    for(var q=0;q<bx.length;q++){cum+=bx[q].n;if(cum>=half){idx=q+1;break}}
    idx=clamp(idx,1,bx.length-1);
    boxes.splice(bi,1,bx.slice(0,idx),bx.slice(idx));
  }
  return boxes.map(function(b){var r=0,g=0,bl=0,n=0;b.forEach(function(p){r+=p.r*p.n;g+=p.g*p.n;bl+=p.b*p.n;n+=p.n});return [Math.round(r/n),Math.round(g/n),Math.round(bl/n)]});
}
function lzw(px,minCode){
  var clear=1<<minCode,eoi=clear+1,codeSize=minCode+1,nextCode=eoi+1,dict=new Map(),buf=0,bits=0,out=[];
  function emit(c){buf|=c<<bits;bits+=codeSize;while(bits>=8){out.push(buf&255);buf>>=8;bits-=8}}
  emit(clear);
  var prefix=px[0];
  for(var i=1;i<px.length;i++){
    var kx=px[i],key=(prefix<<8)|kx,c=dict.get(key);
    if(c!==undefined){prefix=c}
    else{
      emit(prefix);
      if(nextCode>=(1<<codeSize)&&codeSize<12)codeSize++;
      if(nextCode<4096){dict.set(key,nextCode++)}
      else{emit(clear);dict.clear();codeSize=minCode+1;nextCode=eoi+1}
      prefix=kx;
    }
  }
  emit(prefix);emit(eoi);if(bits>0)out.push(buf&255);
  return Uint8Array.from(out);
}
function u16(n){return [n&255,(n>>8)&255]}

async function loadFonts(S){
  try{await Promise.all([
    document.fonts.load(S.weight+' 20px "'+S.font+'"',S.text),
    document.fonts.load('700 20px "'+S.font+'"',S.text),
    document.fonts.load('600 20px "IBM Plex Sans KR"','0123456789ABCDEF 홍길동'),
    document.fonts.load('700 20px "IBM Plex Sans KR"','0123456789%')
  ])}catch(e){}
}

async function encodeGIF(S,onP){
  await loadFonts(S);
  var res=S.res,pw=Math.round(S.w*res),ph=Math.round(S.h*res);
  var cv=document.createElement('canvas');cv.width=pw;cv.height=ph;
  var ctx=cv.getContext('2d',{willReadFrequently:true});
  var nF=Math.max(8,Math.round(S.dur*S.fps)),delay=Math.max(2,Math.round(100/S.fps));
  var bg=hexToRgb(S.bg);
  var cnt=new Float64Array(32768),sr=new Float64Array(32768),sg=new Float64Array(32768),sb=new Float64Array(32768);
  var K=Math.min(12,nF),f,d,i;
  for(var kk=0;kk<K;kk++){
    f=Math.floor(kk*nF/K);drawFrame(ctx,S,f/nF,res);
    d=ctx.getImageData(0,0,pw,ph).data;
    for(i=0;i<d.length;i+=12){
      var r0=d[i],g0=d[i+1],b0=d[i+2];
      if(r0===bg[0]&&g0===bg[1]&&b0===bg[2])continue;
      var key=((r0>>3)<<10)|((g0>>3)<<5)|(b0>>3);cnt[key]++;sr[key]+=r0;sg[key]+=g0;sb[key]+=b0;
    }
    onP(0.08*(kk+1)/K);await tick();
  }
  var bins=[];
  for(i=0;i<32768;i++)if(cnt[i]>0)bins.push({r:sr[i]/cnt[i],g:sg[i]/cnt[i],b:sb[i]/cnt[i],n:cnt[i]});
  var cols=bins.length?medianCut(bins,254):[];
  var pal=new Uint8Array(768);
  pal[0]=bg[0];pal[1]=bg[1];pal[2]=bg[2];
  for(i=0;i<254;i++){var c=cols[i]||bg;pal[(i+1)*3]=c[0];pal[(i+1)*3+1]=c[1];pal[(i+1)*3+2]=c[2]}
  var nPal=cols.length+1;
  var lut=new Int16Array(32768).fill(-1);
  function nearest(r,g,b){
    var best=0,bd=1e9;
    for(var j=0;j<nPal;j++){var dr=pal[j*3]-r,dg=pal[j*3+1]-g,db=pal[j*3+2]-b,dd=dr*dr+dg*dg+db*db;if(dd<bd){bd=dd;best=j}}
    return best;
  }
  var parts=[];
  parts.push(new Uint8Array([0x47,0x49,0x46,0x38,0x39,0x61].concat(u16(pw),u16(ph),[0xF7,0,0])));
  parts.push(pal);
  parts.push(new Uint8Array([0x21,0xFF,0x0B,0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30,0x03,0x01,0,0,0]));
  var prev=null,total=pw*ph;
  for(f=0;f<nF;f++){
    drawFrame(ctx,S,f/nF,res);
    d=ctx.getImageData(0,0,pw,ph).data;
    var idx=new Uint8Array(total);
    for(i=0;i<total;i++){
      var o=i*4,r=d[o],g=d[o+1],b=d[o+2];
      if(r===bg[0]&&g===bg[1]&&b===bg[2]){idx[i]=0;continue}
      var kx=((r>>3)<<10)|((g>>3)<<5)|(b>>3),v=lut[kx];
      if(v<0){v=nearest(r,g,b);lut[kx]=v}
      idx[i]=v;
    }
    var x0=0,y0=0,w2=pw,h2=ph,sub=idx;
    if(prev){
      var minX=pw,maxX=-1,minY=ph,maxY=-1;
      for(var y=0;y<ph;y++){var row=y*pw;for(var x=0;x<pw;x++){if(idx[row+x]!==prev[row+x]){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}}
      if(maxX<0){x0=0;y0=0;w2=1;h2=1;sub=new Uint8Array([255])}
      else{
        x0=minX;y0=minY;w2=maxX-minX+1;h2=maxY-minY+1;sub=new Uint8Array(w2*h2);
        for(var yy=0;yy<h2;yy++){var ro=(y0+yy)*pw+x0,so=yy*w2;for(var xx=0;xx<w2;xx++){var cur=idx[ro+xx];sub[so+xx]=cur===prev[ro+xx]?255:cur}}
      }
    }
    parts.push(new Uint8Array([0x21,0xF9,0x04,(1<<2)|(prev?1:0),delay&255,(delay>>8)&255,255,0]));
    parts.push(new Uint8Array([0x2C].concat(u16(x0),u16(y0),u16(w2),u16(h2),[0])));
    var lz=lzw(sub,8);
    parts.push(new Uint8Array([8]));
    for(var p=0;p<lz.length;p+=255){var sl=lz.subarray(p,Math.min(lz.length,p+255));parts.push(new Uint8Array([sl.length]));parts.push(sl)}
    parts.push(new Uint8Array([0]));
    prev=idx;
    onP(0.08+0.92*(f+1)/nF);await tick();
  }
  parts.push(new Uint8Array([0x3B]));
  return {blob:new Blob(parts,{type:'image/gif'}),frames:nF,pw:pw,ph:ph};
}

/* ---------- UI ---------- */
var thumbCtx={};
function buildThumbs(){
  var box=$('#thumbs');
  LOCKS.forEach(function(L){
    var b=document.createElement('button');b.type='button';b.className='thumb';b.dataset.id=L.id;
    b.innerHTML='<canvas width="336" height="208"></canvas><span class="tn">'+L.name+'</span><span class="td">'+L.desc+'</span>';
    b.addEventListener('click',function(){S.lock=L.id;syncUI()});
    box.appendChild(b);thumbCtx[L.id]=b.querySelector('canvas').getContext('2d');
  });
}
function drawThumbs(){
  var T=theme(S);RES=2;
  LOCKS.forEach(function(L){
    var c=thumbCtx[L.id];c.setTransform(2,0,0,2,0,0);c.globalAlpha=1;c.fillStyle=S.bg;c.fillRect(0,0,168,104);
    c.fillStyle=T.faint;c.beginPath();c.arc(84,52,44,0,TAU);c.fill();
    c.strokeStyle=T.soft;c.lineWidth=2;c.beginPath();c.arc(84,52,44,0,TAU);c.stroke();
    drawLock(c,84,52,56,{T:T,open:0,kind:L.id});
  });
}
var SL=[
  {k:'w',label:'가로 크기',min:360,max:1000,step:10,u:'px'},
  {k:'h',label:'세로 크기',min:120,max:420,step:10,u:'px'},
  {k:'icon',label:'아이콘 크기',min:50,max:160,step:5,u:'%'},
  {k:'fs',label:'글자 크기',min:12,max:44,step:1,u:'px'},
  {k:'steps',label:'진행 단계 수',min:3,max:10,step:1,u:'칸'},
  {k:'dur',label:'한 바퀴 시간',min:1.5,max:8,step:0.1,u:'초'}
];
function buildSliders(){
  var box=$('#sliders');
  SL.forEach(function(o){
    var d=document.createElement('div');d.className='field';
    d.innerHTML='<div class="lab"><span>'+o.label+'</span><output id="o_'+o.k+'"></output></div><input type="range" id="r_'+o.k+'" min="'+o.min+'" max="'+o.max+'" step="'+o.step+'">';
    box.appendChild(d);
    d.querySelector('input').addEventListener('input',function(e){S[o.k]=parseFloat(e.target.value);syncUI()});
  });
}
function buildChips(){
  var box=$('#chips');
  PRESETS.forEach(function(p,i){
    var b=document.createElement('button');b.type='button';b.className='chip';b.dataset.i=i;
    b.innerHTML='<i style="background:linear-gradient(135deg,'+p.bg+' 50%,'+p.main+' 50%)"></i>'+p.n;
    b.addEventListener('click',function(){S.main=p.main;S.bg=p.bg;S.ink=p.ink;syncUI()});
    box.appendChild(b);
  });
}
function bindSeg(id,key,num){
  $(id).querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){S[key]=num?parseFloat(b.dataset.v):b.dataset.v;syncUI()});
  });
}
function syncUI(){
  document.querySelectorAll('.thumb').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.id===S.lock)});
  drawThumbs();
  SL.forEach(function(o){
    var r=$('#r_'+o.k);if(parseFloat(r.value)!==S[o.k])r.value=S[o.k];
    $('#o_'+o.k).textContent=(o.k==='dur'?S[o.k].toFixed(1):S[o.k])+o.u;
  });
  [['#layoutSeg','layout'],['#resSeg','res'],['#fpsSeg','fps'],['#barSeg','bar']].forEach(function(a){
    $(a[0]).querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v)===String(S[a[1]]))});
  });
  document.querySelectorAll('.chip').forEach(function(b){
    var p=PRESETS[b.dataset.i];b.setAttribute('aria-pressed',p.main===S.main&&p.bg===S.bg&&p.ink===S.ink);
  });
  $('#cMain').value=S.main;$('#cBg').value=S.bg;$('#cInk').value=S.ink;
  $('#font').value=S.font;$('#weight').value=String(S.weight);
  var cv=$('#pv');
  if(cv.width!==Math.round(S.w*S.res)||cv.height!==Math.round(S.h*S.res)){cv.width=Math.round(S.w*S.res);cv.height=Math.round(S.h*S.res)}
  cv.style.width='min(100%,'+S.w+'px)';
  $('#cap').textContent=S.w+' × '+S.h+'px · '+S.dur.toFixed(1)+'초 반복';
  fontTimer();
}
var ft=null;
function fontTimer(){clearTimeout(ft);ft=setTimeout(function(){loadFonts(S)},120)}

function frame(now){
  var t=((now/1000)/S.dur)%1;
  drawFrame($('#pv').getContext('2d'),S,t,S.res);
  requestAnimationFrame(frame);
}

var lastBlob=null,lastName='encrypt.gif',lastUrl=null;
async function saveBlob(blob,name){
  var c=window.claude;
  if(c&&typeof c.use==='function'){
    try{
      var dl=await c.use('downloads');
      if(dl){try{await dl.save({filename:name,data:blob});return}catch(e){if(e&&e.code==='declined')return}}
    }catch(e){}
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}

function init(){
  buildThumbs();buildSliders();buildChips();
  $('#text').value=S.text;
  $('#text').addEventListener('input',function(e){S.text=e.target.value;syncUI()});
  $('#font').addEventListener('change',function(e){S.font=e.target.value;syncUI()});
  $('#weight').addEventListener('change',function(e){S.weight=parseInt(e.target.value,10);syncUI()});
  $('#cMain').addEventListener('input',function(e){S.main=e.target.value;syncUI()});
  $('#cBg').addEventListener('input',function(e){S.bg=e.target.value;syncUI()});
  $('#cInk').addEventListener('input',function(e){S.ink=e.target.value;syncUI()});
  bindSeg('#layoutSeg','layout',false);bindSeg('#resSeg','res',true);bindSeg('#fpsSeg','fps',true);bindSeg('#barSeg','bar',true);
  $('#make').addEventListener('click',async function(){
    var btn=$('#make'),bar=$('#bar'),bi=$('#barI');
    btn.disabled=true;btn.textContent='만드는 중…';bar.style.display='block';bi.style.width='0';
    try{
      var out=await encodeGIF(S,function(p){bi.style.width=Math.round(p*100)+'%'});
      lastBlob=out.blob;lastName='encrypt-orbit-'+S.w+'x'+S.h+'.gif';
      if(lastUrl)URL.revokeObjectURL(lastUrl);
      lastUrl=URL.createObjectURL(out.blob);
      $('#resImg').src=lastUrl;
      var kb=out.blob.size/1024;
      $('#resMeta').textContent=out.pw+' × '+out.ph+'px · '+out.frames+'프레임 · '+(kb>=1024?(kb/1024).toFixed(2)+'MB':Math.round(kb)+'KB');
      $('#result').style.display='block';
      $('#result').scrollIntoView({block:'nearest',behavior:'smooth'});
    }catch(err){
      alert('GIF를 만들지 못했어요. 크기나 선명도를 낮춰서 다시 시도해 주세요.');
      console.error(err);
    }
    btn.disabled=false;btn.textContent='GIF 다시 만들기';bar.style.display='none';
  });
  $('#save').addEventListener('click',function(){if(lastBlob)saveBlob(lastBlob,lastName)});
  syncUI();
  requestAnimationFrame(frame);
}
init();
})();
</script>
